# =============================================================================
#  자료 정리 — 한 날짜만 남기고 새로 시작하기
# =============================================================================
#  손으로만 실행됩니다. 저절로 돌지 않습니다.
#
#  실행: https://github.com/choimog/apple/actions/workflows/reset-data.yml
#
#  ⚠️ confirm 을 true 로 두면 자료가 실제로 지워지고 되돌릴 수 없습니다.
#     먼저 false 로 한 번 돌려서 무엇이 지워질지 확인하세요.
# =============================================================================

name: 자료 정리

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dates = 남길 날짜만 두고 나머지 삭제 / orphans = 찌꺼기 삭제"
        required: true
        type: choice
        options: [dates, orphans]
        default: dates
      keep_date:
        description: "남길 날짜 (mode=dates 일 때만, 예: 2026-08-08)"
        required: false
        default: ""
      confirm:
        description: "true 여야 실제로 지웁니다. false 면 확인만 합니다."
        required: false
        default: "false"

concurrency:
  group: data-reset
  cancel-in-progress: false

jobs:
  reset:
    name: 자료 정리
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 도구 설치
        run: pip install --no-cache-dir -r crawler/requirements.txt

      - name: 정리 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KEEP_DATE: ${{ inputs.keep_date }}
          CONFIRM: ${{ inputs.confirm }}
        run: python crawler/reset_data.py --mode "${{ inputs.mode }}"
