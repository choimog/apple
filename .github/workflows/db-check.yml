# =============================================================================
#  데이터베이스 규칙 점검 — 보안 규칙이 진짜로 막는지 확인
# =============================================================================
#  db/*.sql 을 고치면 자동으로 돕니다.
#
#  【왜 필요한가요? — 2026-08-09】
#  보안 규칙은 **틀려도 화면이 멀쩡해 보입니다.** 대표님 브라우저는 로그인이
#  되어 있으니 늘 정상으로 보이고, 잘못 열려 있어도 아무 표시가 나지 않습니다.
#  눈으로는 절대 확인할 수 없는 종류입니다.
#
#  그래서 빈 데이터베이스를 하나 띄워서 실제로 시켜 봅니다.
#  로그인 안 한 사람이 순위를 읽어보고, 보기 전용 회원이 판단을 고쳐보고,
#  관리자가 점수를 바꿔보고 — 막혀야 할 것이 막히는지 확인합니다.
#
#  ⚠️ 진짜 Supabase 에는 접속하지 않습니다. 작업용 컴퓨터 안에
#     빈 데이터베이스를 새로 만들어서 시험하고 지웁니다.
#
#  손으로 돌리기:
#  https://github.com/choimog/apple/actions/workflows/db-check.yml
# =============================================================================

name: 데이터베이스 규칙 점검

on:
  push:
    paths:
      - "db/**"
      - "tests/test_auth_sql.sh"
      - "tests/test_share_open.sh"
      - "tests/test_favorites_sql.sh"
      - ".github/workflows/db-check.yml"
  workflow_dispatch:

jobs:
  check:
    name: 보안 규칙이 실제로 막는지
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: 빈 데이터베이스로 시험
        run: bash tests/test_auth_sql.sh

      # 🚨 【2026-08-12 점검에서 되살림】
      #    db/share.sql 과 db/share-open.sql 은 같은 이름의 함수 셋을 각각
      #    정의합니다. 나중에 실행한 쪽이 이깁니다. 2026-08-10 에 대표님이
      #    "확인표는 다 ✅ 인데 화면은 관리자만 이라고 뜬다" 고 하셨던
      #    원인이 이것이었습니다. 눈으로는 두 경우가 똑같이 생겨서
      #    기계가 봐야 합니다.
      #    (이 시험이 다른 가지에만 남아 있어 여기로 옮겨 왔습니다)
      - name: 공유 링크 회원 공개가 실제로 되는지
        run: bash tests/test_share_open.sh

      # 🚨 【2026-08-18 대표님 요청으로 만든 즐겨찾기】
      #    여기서 틀리면 화면은 멀쩡해 보입니다.
      #      · 남의 즐겨찾기가 새어 나가도 아무 표시가 안 납니다
      #      · 안내문이 안 뜨면 "지워진 책이 없나 보다" 로 읽힙니다
      #      · 반대로 거짓 안내문이 매일 뜨면 진짜 안내문을 못 봅니다
      #    특히 [도서 매칭] 이 도서 번호를 새로 매기는 것(하루 552종)까지
      #    "지워졌습니다" 로 알리지 않는지를 실제 자료로 확인합니다.
      - name: 즐겨찾기가 남에게 새지 않는지 · 거짓 안내문이 없는지
        run: bash tests/test_favorites_sql.sh
