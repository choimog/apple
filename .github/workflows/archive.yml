# =============================================================================
#  보관소로 옮기기 — 오래된 순위 기록을 Cloudflare R2 로
# =============================================================================
#  Supabase 무료 용량(500MB)이 차지 않도록 오래된 날짜를 옮깁니다.
#  데이터를 버리는 게 아니라 옮기는 것입니다.
#
#  【언제 돌아가나요?】
#  매주 월요일 한국시간 오전 8시 (수집·매칭이 끝난 뒤)
#
#  ※ 보관소 접속 정보(Secrets)가 없으면 아무것도 하지 않고 넘어갑니다.
#    설정 방법: docs/archive-setup.md
#
#  손으로 돌리기:
#  https://github.com/choimog/apple/actions/workflows/archive.yml
# =============================================================================

name: 보관소로 옮기기

on:
  schedule:
    # UTC 23:00 (일) = 한국시간 월요일 08:00
    - cron: "0 23 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true 로 두면 무엇을 옮길지 보여주기만 합니다"
        required: false
        default: "true"

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    name: 오래된 기록 옮기기
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 도구 설치
        run: pip install --no-cache-dir -r crawler/requirements.txt

      - name: 옮기기
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python crawler/archive.py
