# =============================================================================
#  기준 밖 순위 정리 — 일간 300위 · 주간 500위
# =============================================================================
#
#  【무엇을 하나요? — 2026-08-11 대표님 결정】
#  "일간은 매일 300위권, 주간은 매일 500위권까지 취합하는 걸로 하고,
#   현재 이 기준에서 벗어난 순위권의 데이터는 지우는 걸로 하면
#   더 오래 버틸 수 있으려나?"
#
#  앞으로 모을 양은 config/sources.yaml 에서 이미 줄여 두었습니다.
#  이 작업은 **이미 쌓여 있는** 기준 밖 자료를 정리합니다.
#
#  【왜 SQL 이 아니라 여기인가요?】
#  같은 일을 하는 db/space-trim.sql 을 먼저 드렸는데 Supabase 화면에서
#  "Failed to fetch" 로 끊겼습니다. SQL 이 틀린 게 아니라 36만 줄을
#  한 번에 지우느라 브라우저 제한 시간(약 2분)을 넘긴 것입니다.
#  여기서는 시간이 넉넉하고, 분야 하나씩 나눠서 지웁니다.
#
#  【어떻게 실행하나요?】
#  https://github.com/choimog/apple/actions/workflows/trim-ranks.yml
#  → 오른쪽 [Run workflow] 버튼
#     dry_run 을 true 로 두면 **아무것도 안 지우고** 얼마나 지울지만
#     알려 줍니다. 처음이면 true 로 한 번 보시는 것을 권합니다.
#
#  【안전장치】
#  대표님이 손으로 내리신 결정(같은 책 / 다른 책)이 걸린 상품은 지우지
#  않습니다. 지우면 데이터베이스가 그 결정까지 함께 지우기 때문입니다.
#  시작할 때와 끝날 때 그 건수를 세어서, 하나라도 줄면 실패로 끝냅니다.
#
#  【중간에 끊기면?】
#  다시 누르시면 됩니다. 이미 지운 것은 지워진 채로 남고 나머지만 합니다.
# =============================================================================

name: 기준 밖 순위 정리 (trim ranks)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "확인만 하고 안 지우려면 true"
        required: false
        default: "true"

# 수집이나 매칭이 도는 중에 겹치지 않게 합니다
concurrency:
  group: trim-ranks
  cancel-in-progress: false

jobs:
  trim:
    name: 기준 밖 순위 정리
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 도구 설치
        run: pip install --no-cache-dir -r crawler/requirements.txt

      - name: 규칙 시험 (지우면 안 되는 것을 지키는지)
        # 이 작업은 되돌릴 수 없습니다. 규칙이 깨졌으면 여기서 멈춥니다.
        run: python tests/test_trim_ranks.py

      - name: 정리 실행
        env:
          # GitHub Secrets 에서 가져옵니다. 코드에는 값이 없습니다.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python crawler/trim_ranks.py
