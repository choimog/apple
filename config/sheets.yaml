# =============================================================================
#  Google Sheets 자동 내보내기 설정
# =============================================================================
#  매일 수집·매칭이 끝난 뒤, 아래에 적은 순위표를 구글 시트에 쌓습니다.
#  화면에서 엑셀 버튼을 누르지 않아도 시트가 알아서 채워집니다.
#
#  【켜는 법】 docs/sheets-setup.md 를 보세요 (대표님이 10분 정도 하셔야 합니다)
#  접속 정보가 없으면 아무 일도 안 하고 조용히 넘어갑니다.
# =============================================================================

# 시트에 며칠치를 남길지.
#
# ⚠️ 구글 시트는 한 문서에 약 1,000만 칸까지만 담깁니다.
#    한 줄이 9칸이므로, 100줄짜리 표 3개를 매일 쌓으면
#    하루 2,700칸 → 180일이면 약 49만 칸입니다. 넉넉합니다.
#    아래 exports 를 늘리시면 이 숫자도 같이 보셔야 합니다.
keep_days: 180

# 무엇을 내보낼지. 하나가 시트 탭 하나가 됩니다.
#
#  kind: combined  → 종합 순위 (2개 서점 이상에 오른 책)
#        category  → 특정 서점의 특정 분야
#
# ⚠️ 여기 적은 이름(store/category)이 config/sources.yaml 과 다르면
#    그 탭은 '찾을 수 없음' 으로 실패합니다. 조용히 빈 탭을 만들지 않습니다.
exports:
  - tab: "종합 일간 TOP100"
    kind: combined
    period: daily        # daily | weekly
    unified: all         # 통합 분야 코드 (all = 전체)
    min_stores: 2        # 몇 개 서점 이상에 올라야 넣을지
    top: 100

  - tab: "종합 주간 TOP100"
    kind: combined
    period: weekly
    unified: all
    min_stores: 2
    top: 100

  - tab: "알라딘 일간 종합 TOP100"
    kind: category
    store: aladin        # kyobo | yes24 | aladin
    category_kind: online   # online(온라인 일간) | weekly(주간) | offline(교보 매장)
    # ⚠️ 서점마다 부르는 이름이 다릅니다. 알라딘은 '전체' 가 아니라 '종합' 입니다.
    #    여기 이름이 config/sources.yaml 과 한 글자라도 다르면 그 탭은
    #    빈 탭이 되는 게 아니라 **실패로 알립니다.** (조용히 넘어가지 않습니다)
    category: "종합"
    top: 100
