# =============================================================================
#  보관소로 옮기기 — 오래된 순위를 파일로 빼고 DB 를 비웁니다
# =============================================================================
#  【2026-08-08 대표님 결정】
#  카드 등록 없이 GitHub 에 보관합니다.
#
#  R2 와 결정적으로 다른 점: **GitHub 은 기한이 지나면 파일을 지웁니다.**
#  그래서 "올렸다" 는 말만 믿고 DB 에서 지우면 안 됩니다.
#  아래처럼 **실제로 다시 내려받아 확인한 것만** 지웁니다.
#
#     1단계 뽑아내기   파일로 만들기만 함 (DB 는 손도 안 댐)
#     2단계 올리기     GitHub 에 보관
#     3단계 내려받기   방금 올린 것을 실제로 다시 받아옴
#     4단계 확인·정리  지문·줄 수가 맞는 것만 DB 에서 지움
#
#  실행: https://github.com/choimog/apple/actions/workflows/archive.yml
# =============================================================================

name: 보관소로 옮기기

on:
  schedule:
    # 매일 UTC 23:00 = 한국시간 다음날 08:00
    #
    # 【2026-08-18 주 1회 → 매일로 바꿨습니다】
    # 주 1회면 순위 자료가 DB 에 최대 21일치까지 남습니다(보관 14일 +
    # 다음 실행까지 7일). 그만큼 용량을 더 쓰는 것도 문제지만, 더 큰
    # 문제는 [도서 목록 정리] 가 그 뒤에 붙는다는 점입니다. 상품은 순위가
    # 한 줄이라도 남아 있으면 못 지우므로, 보관이 주 1회면 도서 목록도
    # 주 1회만 정리됩니다. 매일 돌면 둘 다 딱 14일치에서 멈춥니다.
    #
    # 옮길 날짜가 없는 날은 몇 초 만에 "옮길 것이 없습니다" 하고 끝납니다.
    - cron: "13 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true 면 무엇을 옮길지 보여주기만 합니다"
        required: false
        default: "true"

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    name: 보관소로 옮기기
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 도구 설치
        run: pip install --no-cache-dir -r crawler/requirements.txt

      - name: 담기·풀기 시험 (파일이 깨지면 되돌릴 수 없습니다)
        run: |
          python tests/test_archive_roundtrip.py
          python tests/test_archive_commit.py
          python tests/test_archive_preflight.py
          # 🚨 2026-08-28 대표님 요청으로 넣은 '엑셀로 열리는 파일'.
          #    제목은 보관하는 이 순간에만 남길 수 있습니다 — 이 날짜가
          #    빠져나가면 [도서 목록 정리] 가 그 상품 줄을 지웁니다.
          python tests/test_archive_readable.py

      # ---------- 1단계 ----------
      - name: 뽑아내기 (DB 는 손대지 않습니다)
        id: export
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python crawler/archive.py --export out
          # 뽑아낸 게 있는지 다음 단계가 알 수 있게 표시해 둡니다
          if [ -s out/manifest.json ] && [ "$(cat out/manifest.json)" != "[]" ]; then
            echo "has_data=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_data=false" >> "$GITHUB_OUTPUT"
          fi

      # ---------- 2단계 ----------
      - name: 올리기
        if: steps.export.outputs.has_data == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ github.run_id }}
          path: out/
          # ⚠️ GitHub 보관 기간의 최대값은 90일입니다.
          #    한도를 넘는 값을 적으면 이 단계에서 실패합니다.
          #    (2026-08-09: 400 으로 적었다가 대표님이 설정 화면에서
          #     'Duration must be 90 or less' 를 발견해 주셨습니다)
          retention-days: 90
          if-no-files-found: error
          compression-level: 0   # 이미 gzip 이라 다시 압축할 필요 없습니다

      # ---------- 3단계 ----------
      #  방금 올린 것을 '실제로' 다시 받아옵니다.
      #  이게 없으면 올라갔는지 확인할 방법이 없습니다.
      - name: 내려받아 확인 준비
        if: steps.export.outputs.has_data == 'true'
        uses: actions/download-artifact@v4
        with:
          name: archive-${{ github.run_id }}
          path: verify/

      # ---------- 4단계 ----------
      - name: 확인하고 DB 정리
        if: steps.export.outputs.has_data == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python crawler/archive.py \
            --commit verify \
            --manifest out/manifest.json

      - name: 내려받는 곳 안내
        if: steps.export.outputs.has_data == 'true'
        run: |
          {
            echo "## 📦 보관 파일을 내려받으세요"
            echo ""
            echo "이 실행의 맨 아래 **Artifacts** 에서 받을 수 있습니다."
            echo ""
            echo "- 파일 이름: \`archive-${{ github.run_id }}\`"
            echo "- 주소: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "> ⚠️ GitHub 보관은 **기한이 지나면 자동으로 사라집니다.**"
            echo "> 사이트 [수집 상태] 화면에서 남은 날짜를 확인할 수 있습니다."
            echo "> 사라지기 전에 내려받아 PC 나 구글 드라이브에 두세요."
          } >> "$GITHUB_STEP_SUMMARY"
