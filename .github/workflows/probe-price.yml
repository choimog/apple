# =============================================================================
#  정가 탐침 — 알라딘·교보가 어떤 숫자를 정가로 읽는지 눈으로 확인
# =============================================================================
#  【왜 필요한가요? — 2026-08-12 대표님 신고】
#    "문학동네의 긴긴밤이란 책이 예스랑 교보에는 12,500원인데
#     알라딘엔 15,000원으로 등록되어있어. 실제로 가보니 12,500원인데"
#
#  예스24는 정가 전용 이름표가 있어 정확합니다. 교보·알라딘은 **칸 글자를
#  통째로 훑어** 숫자 중 큰 값을 정가로 봅니다. 칸 안에 배송 안내 같은
#  더 큰 숫자가 있으면 그게 정가가 됩니다.
#
#  짐작으로 고치면 다른 것이 깨집니다. 그래서 **실제 화면의 숫자를 앞뒤
#  글자와 함께** 보고 나서 고칩니다.
#
#  실행: 이 화면 오른쪽 [Run workflow]
#  ※ 목록 페이지 한 장씩만 받습니다. 저장하는 것은 없습니다.
# =============================================================================

name: 정가 탐침

on:
  workflow_dispatch:

jobs:
  probe:
    name: 칸 안의 숫자 확인
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 도구 설치
        run: pip install --no-cache-dir -r crawler/requirements.txt

      - name: 탐침
        run: python crawler/probe_price.py
