# =============================================================================
#  웹 사이트 확인
# =============================================================================
#  사이트 코드를 고칠 때마다 자동으로 두 가지를 확인합니다.
#
#    1. 빌드가 되는가        (문법 오류·타입 오류 잡기)
#    2. 조회문이 실제로 되는가 (배포하고 나서 빈 화면 보는 일 방지)
#
#  ※ 2번은 실제 데이터베이스에 붙습니다. 읽기만 합니다.
#  ※ 관리자 열쇠는 이 작업 안에서만 쓰이고, 배포되는 사이트에는 들어가지 않습니다.
# =============================================================================

name: 웹 사이트 확인

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web-check.yml"
  workflow_dispatch:

jobs:
  check:
    name: 빌드 + 조회문 확인
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 필요한 도구 설치
        run: npm ci --no-audit --no-fund

      - name: 엑셀 내려받기 규칙 시험
        # CSV 는 조용히 망가집니다. 제목에 쉼표가 하나 들어가면 그 줄부터
        # 칸이 통째로 밀리는데 파일은 정상적으로 열립니다. 여기서 잡습니다.
        run: node scripts/test-csv.mjs

      - name: 자료 끊김 경고 규칙 시험
        # 이 경고는 '아무 신호도 안 나는 고장'(예약 작업 자동 중단)을 잡는
        # 유일한 장치입니다. 너무 늦게 떠도, 매일 떠도 쓸모가 없어집니다.
        run: node scripts/test-stale.mjs

      - name: 묶음 크기 규칙 시험
        # 서점이 셋이라 3권이 정상입니다. 경계가 어긋나면 정작 찾아야 할
        # '4권 이상'(한 서점에서 두 권이 묶임)이 정상 칸에 숨습니다.
        run: node scripts/test-sizes.mjs

      - name: 점수 구간 규칙 시험
        # 경계가 하나 어긋나면 어떤 짝은 어느 구간에도 안 들어가서
        # 조용히 사라집니다. 목록은 멀쩡해 보입니다.
        run: node scripts/test-bands.mjs

      - name: 리포트 팝업 규칙 시험
        # 이 규칙은 틀려도 화면이 멀쩡해 보입니다. "안 뜬다" 가 정상인지
        # 고장인지 눈으로는 구분이 안 되므로 기계가 봅니다.
        run: node scripts/test-popup.mjs

      - name: 조회문이 실제 데이터베이스에서 되는지 확인
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-queries.mjs

      - name: 빌드 (실제 열쇠는 안 씁니다)
        # 빌드할 때는 가짜 주소를 씁니다. 실제 값은 Vercel 에 등록돼 있습니다.
        # (관리자 열쇠가 사이트 코드에 섞여 들어가지 않도록)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://build-check.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-check
        run: npx next build

      - name: 실제 데이터로 다시 빌드 + 모든 화면 열어보기
        # 빌드가 통과해도 화면이 멀쩡하다는 뜻은 아닙니다.
        # 위 빌드는 가짜 접속 정보로 돌기 때문에 조회문이 실제로 도는지
        # 확인하지 못합니다. 여기서 진짜 열쇠로 띄우고 전부 열어봅니다.
        # (SUPABASE_ANON_KEY 가 없으면 스스로 건너뜁니다)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            # ⚠️ 지난 빌드 결과를 지우고 새로 빌드합니다.
            #    남아 있으면 Next 가 예전 판단(정적/동적)을 재사용해서,
            #    주소 뒤 값(?period=weekly)을 쓰는 화면이 열릴 때 오류가 납니다.
            #    (2026-08-08 실제로 겪음)
            rm -rf .next
            npx next build
          fi
          node scripts/smoke.mjs

      - name: 보안 취약점 확인
        run: npm audit --omit=dev

      # ⚠️ 이 확인은 일부러 맨 마지막에 둡니다.
      #    여기서 멈추면 뒤 단계가 안 돌기 때문입니다. 보안 확인 하나가
      #    빨간불이라고 화면 확인까지 못 돌면, 진짜 고장을 놓칩니다.
      - name: 로그인 없이 자료가 새어 나가는지 확인
        # 공개용 열쇠는 브라우저 안에 그대로 들어 있습니다. 사이트만 막고
        # 데이터베이스를 안 막으면, 사이트를 거치지 않고 직접 읽을 수
        # 있습니다. 눈으로는 절대 못 잡는 구멍이라 기계가 봅니다.
        # SUPABASE_ANON_KEY 가 없으면 건너뜁니다.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/check-anon.mjs
