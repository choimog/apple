# =============================================================================
#  교보 속도 실측 (수동 실행 전용)
# =============================================================================
#  per=200 으로 바꾼 뒤 교보 페이지가 45초를 넘겨 실패하는 원인을 재봅니다.
#  같은 페이지를 세 가지 방식으로 열어 시간·도서수·ISBN 확보를 비교합니다.
#
#  실행: https://github.com/choimog/apple/actions/workflows/probe-kyobo-speed.yml
# =============================================================================

name: 교보 속도 실측

on:
  workflow_dispatch:

jobs:
  probe:
    name: 세 방식 비교
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 필요한 도구 설치
        run: pip install --no-cache-dir -r crawler/requirements.txt
      - name: 브라우저(크로미움) 설치
        uses: ./.github/actions/browser
      - name: 실측
        run: python crawler/probe_kyobo_speed.py
