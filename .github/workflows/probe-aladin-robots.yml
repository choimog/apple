# =============================================================================
#  알라딘 robots 원문 — 수동 실행 전용
# =============================================================================
#  [매일 수집] 이 "robots.txt 가 수집을 금지합니다" 로 멈췄습니다.
#  알라딘이 규칙을 바꾼 것인지, 우리 파서가 잘못 읽은 것인지 가립니다.
#
#  ※ 요청 1건 (robots.txt 만). 목록·상세 페이지 진입 없음. DB 안 건드림.
#
#  실행: https://github.com/choimog/apple/actions/workflows/probe-aladin-robots.yml
# =============================================================================

name: 알라딘 robots 원문

on:
  workflow_dispatch:

jobs:
  probe:
    name: robots.txt 원문과 파서 판단
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 도구 설치
        run: pip install --no-cache-dir -r crawler/requirements.txt

      - name: 원문 확인
        run: python crawler/probe_aladin_robots.py
