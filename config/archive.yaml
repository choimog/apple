# =============================================================================
#  보관소(아카이브) 설정
# =============================================================================
#
#  【무슨 일을 하나요?】
#  오래된 순위 기록을 Supabase 에서 Cloudflare R2 로 옮깁니다.
#  Supabase 무료 용량(500MB)이 차는 것을 막기 위해서입니다.
#
#  【데이터가 없어지나요?】
#  아니요. 옮기는 것이지 지우는 게 아닙니다.
#  R2 는 무료 10GB 이고, 지금 속도로 20년 넘게 쓸 수 있습니다.
#  다만 옮긴 날짜는 사이트에서 바로 못 보고, 파일로 내려받아야 합니다.
#
#  【설정 방법】
#  docs/archive-setup.md 를 보세요. (약 10분, 0원)
# =============================================================================

# -----------------------------------------------------------------------------
#  Supabase 에 며칠치를 남겨둘지
# -----------------------------------------------------------------------------
#  이 날수보다 오래된 것만 보관소로 옮깁니다.
#
#  · 숫자를 늘리면 → 사이트에서 더 긴 기간을 볼 수 있지만 용량을 더 씁니다
#  · 숫자를 줄이면 → 용량이 여유롭지만 사이트에서 볼 수 있는 기간이 짧아집니다
#
#  ⚠️ 안전장치: 14일 밑으로는 내려가지 않습니다 (코드에서 막아둠).
#     최근 데이터를 실수로 날리는 것을 방지하기 위해서입니다.
# 【2026-08-08 무료 요금제로 가기로 결정】
# 무료 500MB 는 하루 23.4MB 씩 차서 약 18일이면 찹니다.
# 그래서 14일만 남깁니다. (14일이 코드에 박아 둔 최소값입니다)
#
# 나중에 Supabase Pro(8GB) 로 올리시면 90 으로 바꾸세요.
# 그래도 2.1GB 밖에 안 씁니다.
keep_days: 14

# -----------------------------------------------------------------------------
#  수집 기록(crawl_logs)과 AI 리포트(daily_reports)를 며칠치 남길지
# -----------------------------------------------------------------------------
#  【2026-08-09 대표님 승인】
#  "리포트도 기록이 지워질 때, 해당 일자에 해당하는 건 함께 지워줘도 돼."
#  그래서 둘 다 이 값 하나로 같이 정리합니다.
#  ⚠️ 이 값을 고치면 web/lib/report.ts 의 REPORT_KEEP_DAYS 도 같이 고쳐야
#     합니다. (시험 tests/test_capacity.py 가 어긋나면 잡아냅니다)
#  【2026-08-09 추가 — 대표님 질문에서 찾은 문제】
#  "리포트가 계속 누적되는 것 때문에 용량 계산에 문제가 생기진 않으려나?"
#  확인해 보니 리포트(하루 1줄)보다 **수집 기록이 진짜 문제**였습니다.
#  분야가 208개라 하루 208줄, 1년이면 7만 줄이 쌓이는데 아무도 안 지웠습니다.
#
#  사이트 [수집 상태] 화면은 최근 14일치만 씁니다.
#  '평소보다 적게 걷혔나' 자가 점검은 최근 7일치만 씁니다.
#  180일이면 넉넉하고도 남습니다.
log_keep_days: 180

# -----------------------------------------------------------------------------
#  용량 경고 기준 (MB)
# -----------------------------------------------------------------------------
#  남은 데이터의 예상 크기가 이 값을 넘으면 경고합니다.
#  Supabase 무료는 500MB 이므로 여유를 두고 400 으로 잡았습니다.
warn_over_mb: 400

# -----------------------------------------------------------------------------
#  한 번에 옮길 최대 날짜 수
# -----------------------------------------------------------------------------
#  처음 실행할 때 몇 달치가 한꺼번에 걸리면 오래 걸리므로 나눠서 합니다.
#  다음 주에 나머지가 이어서 옮겨집니다.
max_dates_per_run: 14

# -----------------------------------------------------------------------------
#  보관소 안의 파일 이름 형식
# -----------------------------------------------------------------------------
#  예: rankings/2026/01/rankings_2026-01-15.jsonl.gz
key_template: "{table}/{yyyy}/{mm}/{table}_{date}.jsonl.gz"

# 어디에 보관할지
#   github  GitHub 에 파일로 보관 (카드 불필요, 기한이 지나면 사라짐)
#   r2      Cloudflare R2 (카드 필요, 영구 보관)
#
# 【2026-08-08 대표님 결정】
# 카드 등록이 부담스러워 GitHub 으로 시작합니다.
# 운영해 보고 괜찮으면 나중에 r2 로 바꿉니다. 값만 바꾸면 됩니다.
storage: github

# GitHub 이 파일을 며칠 보관할지.
#
# ⚠️ 최대값은 90일입니다. 그 이상은 넣을 수 없습니다.
#    즉 보관 파일은 90일 뒤 자동으로 사라집니다.
#    → 대표님이 두세 달에 한 번은 내려받아 두셔야 합니다.
#    (사이트 [수집 상태] 에 남은 날짜가 뜨고, 30일 밑이면 메일도 갑니다)
github_retention_days: 90

# 사라지기 며칠 전부터 메일로 알릴지.
#
# [보관 파일 만료 알림] 작업이 매주 목요일에 돌면서, 이 날짜 안에
# 사라지는 파일이 있으면 **일부러 실패로 끝냅니다.**
# GitHub 은 작업이 실패하면 메일을 보내주기 때문입니다.
#
# 내려받으신 뒤 같은 작업을 'true' 로 한 번 돌리시면 알림이 멈춥니다.
expiry_warn_days: 30
