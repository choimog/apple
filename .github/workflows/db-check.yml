# =============================================================================
#  데이터베이스 규칙 점검 — 보안 규칙이 진짜로 막는지 확인
# =============================================================================
#  db/*.sql 을 고치면 자동으로 돕니다.
#
#  【왜 필요한가요? — 2026-08-09】
#  보안 규칙은 **틀려도 화면이 멀쩡해 보입니다.** 대표님 브라우저는 로그인이
#  되어 있으니 늘 정상으로 보이고, 잘못 열려 있어도 아무 표시가 나지 않습니다.
#  눈으로는 절대 확인할 수 없는 종류입니다.
#
#  그래서 빈 데이터베이스를 하나 띄워서 실제로 시켜 봅니다.
#  로그인 안 한 사람이 순위를 읽어보고, 보기 전용 회원이 판단을 고쳐보고,
#  관리자가 점수를 바꿔보고 — 막혀야 할 것이 막히는지 확인합니다.
#
#  ⚠️ 진짜 Supabase 에는 접속하지 않습니다. 작업용 컴퓨터 안에
#     빈 데이터베이스를 새로 만들어서 시험하고 지웁니다.
#
#  손으로 돌리기:
#  https://github.com/choimog/apple/actions/workflows/db-check.yml
# =============================================================================

name: 데이터베이스 규칙 점검

on:
  push:
    paths:
      - "db/**"
      - "tests/test_auth_sql.sh"
      - ".github/workflows/db-check.yml"
  workflow_dispatch:

jobs:
  check:
    name: 보안 규칙이 실제로 막는지
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: 빈 데이터베이스로 시험
        run: bash tests/test_auth_sql.sh
