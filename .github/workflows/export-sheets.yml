# =============================================================================
#  구글 시트 내보내기 — 순위표를 구글 시트에 매일 쌓기
# =============================================================================
#  【무엇을 하나요?】
#  config/sheets.yaml 에 적어 둔 순위표를 구글 시트에 붙여 넣습니다.
#  덮어쓰지 않고 날짜별로 아래에 쌓으므로, 시트에서 바로 흐름을 볼 수 있습니다.
#
#  【켜는 법】 docs/sheets-setup.md 를 한 번 따라 하시면 됩니다 (약 10분).
#  아직 안 하셨다면 이 작업은 "할 일이 없습니다" 하고 조용히 끝납니다.
#  (빨간 X 를 매일 띄우면 진짜 고장까지 같이 묻히기 때문입니다)
#
#  실행: https://github.com/choimog/apple/actions/workflows/export-sheets.yml
# =============================================================================

name: 구글 시트 내보내기

on:
  # ---------------------------------------------------------------------
  #  ★ 매칭이 끝나면 **바로** 시작합니다 (2026-08-09 대표님 요청)
  # ---------------------------------------------------------------------
  #  "리포트가 9시 30분까지는 나왔으면 좋겠다" 는 말씀에 맞춘 것입니다.
  #  시각을 앞당기는 대신, 앞 작업이 끝나는 것을 보고 이어서 돕니다.
  #  실제로 잰 시간 기준 보통 07:20~07:35 에 끝납니다.
  workflow_run:
    workflows: ["도서 매칭"]
    types: [completed]

  schedule:
    # UTC 01:00 = 한국시간 10:00 — **보험용**입니다.
    # 위의 '매칭이 끝나면 바로' 가 안 걸린 날을 대비합니다.
    # 이미 그 날짜가 시트에 있으면 아무것도 하지 않고 끝납니다.
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  group: export-sheets
  cancel-in-progress: false

jobs:
  export:
    name: 시트에 쌓기
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 앞 작업이 사람 손으로 취소된 경우만 건너뜁니다.
    # (매칭이 실패해도 어제까지의 자료로 할 일은 있습니다. 그리고 이
    #  두 작업은 '같은 날짜면 아무것도 안 함' 이라 헛돌아도 안전합니다)
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion != 'cancelled'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 도구 설치
        # ※ cache: pip 를 쓰지 마세요. --no-cache-dir 과 충돌해 작업이
        #   성공했는데도 실패로 표시됩니다 (2026-08-07 실제로 겪음).
        run: pip install --no-cache-dir -r crawler/requirements.txt

      - name: 규칙 시험 (설정이 깨졌으면 여기서 멈춤)
        run: python tests/test_sheets.py

      - name: 시트에 쌓기
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 이 두 개는 docs/sheets-setup.md 대로 등록하시면 생깁니다.
          # 없으면 아무 일도 하지 않고 성공으로 끝납니다.
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python crawler/export_sheets.py
