# =============================================================================
#  도서 매칭 — 세 서점의 같은 책을 하나로 묶기
# =============================================================================
#  **수집이 끝나는 즉시** 자동으로 이어서 돌아갑니다 (보통 한국시간 07:15~07:30).
#  예전에는 09:00 이라고 시각을 박아 뒀는데, 수집이 일찍 끝나도 그때까지
#  기다렸습니다. 2026-08-09 부터 앞 작업을 보고 이어 붙입니다.
#  손으로 돌리고 싶으면 아래 주소에서 [Run workflow] 를 누르세요.
#
#  실행: https://github.com/choimog/apple/actions/workflows/match.yml
#
#  ※ 규칙 설명: docs/matching-rules.md
#  ※ 숫자 설정: config/matching.yaml (고친 뒤 이걸 한 번 돌려야 반영됩니다)
# =============================================================================

name: 도서 매칭

on:
  # ---------------------------------------------------------------------
  #  ★ 수집이 끝나면 **바로** 시작합니다 (2026-08-09 대표님 요청)
  # ---------------------------------------------------------------------
  #  예전에는 "09:00 에 시작" 이라고 시각으로 정해 뒀습니다. 수집이
  #  언제 끝날지 몰라서 넉넉히 3시간을 비워 둔 것입니다. 그 대신
  #  수집이 07:20 에 끝나도 매칭은 09:00 까지 그냥 기다렸습니다.
  #
  #  이제는 시계를 보지 않고 **수집이 끝나는 것을 보고** 시작합니다.
  #  실제로 잰 시간: 수집 61~81분 · 매칭 5분.
  #  06:00 에 시작하면 매칭은 보통 07:15~07:30 에 끝납니다.
  workflow_run:
    workflows: ["매일 수집 (daily crawl)"]
    types: [completed]

  schedule:
    # UTC 00:00 = 한국시간 09:00 — **보험용**입니다.
    #
    # 위의 '수집이 끝나면 바로' 가 어떤 이유로든 안 걸리면, 매칭이
    # 통째로 빠진 채 조용히 하루가 지나갑니다. 그것을 막습니다.
    # 이미 매칭이 됐어도 다시 계산할 뿐 결과는 같습니다 (5분·무료).
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true 로 두면 DB 에 저장하지 않고 결과만 봅니다"
        required: false
        default: "false"

# 같은 작업이 겹쳐 도는 것을 막습니다
concurrency:
  group: book-match
  cancel-in-progress: false

jobs:
  match:
    name: 같은 책 묶기
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # ⚠️ '수집이 성공했을 때만' 으로 막으면 안 됩니다.
    #    수집 작업 안에는 [용량 확인] 이 같이 들어 있어서, 저장공간이
    #    한도에 가까우면 수집 자체는 멀쩡해도 전체가 '실패' 로 표시됩니다.
    #    그걸 조건으로 걸면 용량 경고가 뜬 날은 리포트까지 통째로
    #    안 나옵니다. 그래서 '사람이 취소한 경우' 만 건너뜁니다.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion != 'cancelled'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 도구 설치
        # ※ cache: pip 를 쓰지 마세요. --no-cache-dir 과 충돌해 작업이
        #   성공했는데도 실패로 표시됩니다 (2026-08-07 실제로 겪음).
        run: pip install --no-cache-dir -r crawler/requirements.txt

      - name: 규칙 시험 (규칙이 깨졌으면 여기서 멈춤)
        run: |
          python tests/test_match.py
          python tests/test_manual_split.py
          python tests/test_manual_merge.py
          python tests/test_verify_publishers.py
          python tests/test_schedule.py

      - name: 매칭 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python crawler/run_match.py

      # -----------------------------------------------------------------
      #  묶은 결과를 실제 자료로 검사합니다.
      #
      #  【왜 필요한가요? — 2026-08-08】
      #  "규칙을 고쳤다" 와 "데이터베이스에서 정말 갈라졌다" 는 다릅니다.
      #  출판사가 다른 책이 한 권으로 뭉쳐 있으면 여기서 빨간불이 납니다.
      #  (확인만 하는 dry_run 일 때는 저장을 안 했으니 건너뜁니다)
      # -----------------------------------------------------------------
      - name: 묶인 결과 검사 (출판사가 섞이지 않았는지)
        if: ${{ inputs.dry_run != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python crawler/verify_publishers.py
