# =============================================================================
#  정밀 탐침 (probe) — 수동 실행 전용
# =============================================================================
#
#  【무엇을 하나요?】
#  1. Supabase 연결과 표(테이블) 생성이 제대로 됐는지 확인합니다.
#  2. 알라딘 목록의 내부 구조를 뜯어서 보여줍니다.
#     → 이걸 보고 크롤러의 선택자(값 뽑는 규칙)를 정확히 작성합니다.
#
#  ※ 서점에는 요청 1건만 보냅니다. 상세 페이지 진입 없음.
#  ※ 비밀키는 로그에 절대 출력하지 않습니다 (GitHub가 자동으로 ***로 가림).
#
#  실행: [Actions] 탭 → [정밀 탐침 (probe)] → [Run workflow]
#  직접 링크: https://github.com/choimog/apple/actions/workflows/probe.yml
# =============================================================================

name: 정밀 탐침 (probe)

on:
  workflow_dispatch:

jobs:
  probe:
    name: Supabase 확인 + 알라딘 구조 덤프
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 도구 설치
        run: pip install --no-cache-dir -r crawler/requirements.txt

      - name: 규칙 시험 (ISBN 을 잘못 읽지 않는지)
        # 잘못된 ISBN 하나가 엉뚱한 두 책을 영원히 한 권으로 만듭니다.
        run: |
          python tests/test_probe_isbn.py
          python tests/test_probe_trust.py

      - name: 탐침 실행
        env:
          # GitHub Secrets 에서 값을 가져옵니다. 코드에는 값이 없습니다.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python crawler/probe.py

      # -----------------------------------------------------------------
      #  2026-08-11 대표님 질문 — "알라딘·예스는 ISBN 을 절대 못 따나?"
      # -----------------------------------------------------------------
      #  이미 저장해 둔 표지 주소 13만 건을 세어서 답합니다.
      #  서점에 요청을 보내지 않고, 아무것도 저장하지 않습니다.
      # -----------------------------------------------------------------
      - name: ① 표지 주소에 ISBN 이 들어 있는지 (저장된 13만 건)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python crawler/probe_isbn.py

      # -----------------------------------------------------------------
      #  ② 표지 말고 **목록 페이지 어딘가**에 숨어 있는지
      # -----------------------------------------------------------------
      #  앞서 본 것은 표지 주소 하나뿐이었습니다. 목록 페이지에는 링크,
      #  data-* 속성, 자바스크립트 변수 등 수십 가지 값이 더 있습니다.
      #  매일 받던 그 페이지를 서점마다 한 장씩만 더 받아 훑습니다.
      #  robots.txt 를 먼저 보고, 금지면 그 서점은 건너뜁니다.
      # -----------------------------------------------------------------
      - name: ② 목록 페이지 HTML 전체에 ISBN 이 숨어 있는지
        run: python crawler/probe_isbn_html.py

      # -----------------------------------------------------------------
      #  ③ 🚨 찾아낸 것을 **믿어도 되는지** 확인 (2026-08-11 탐침 결과)
      # -----------------------------------------------------------------
      #  ① 에서 알라딘 표지 ISBN 34.8%, 교보 정가 44.4% 가 나왔습니다.
      #  둘 다 좋은 소식이지만 아직 믿으면 안 됩니다.
      #    · ISBN10 검사식은 11분의 1 확률로 우연히 통과합니다
      #    · 교보 정가는 실제 화면을 못 봐서 두루뭉술하게 읽고 있습니다
      #  틀린 ISBN 은 엉뚱한 두 책을 영원히 한 권으로 만들고,
      #  틀린 정가는 지금 규칙(정가가 다르면 다른 책)에서 멀쩡한 짝을
      #  조용히 갈라냅니다. 그래서 교보 ISBN 을 기준 삼아 맞대 봅니다.
      # -----------------------------------------------------------------
      - name: ③ 찾아낸 ISBN·정가를 믿어도 되는지
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python crawler/probe_trust.py
