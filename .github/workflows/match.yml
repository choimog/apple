# =============================================================================
#  도서 매칭 — 세 서점의 같은 책을 하나로 묶기
# =============================================================================
#  매일 수집이 끝난 뒤(한국시간 07:00) 자동으로 돌아갑니다.
#  손으로 돌리고 싶으면 아래 주소에서 [Run workflow] 를 누르세요.
#
#  실행: https://github.com/choimog/apple/actions/workflows/match.yml
#
#  ※ 규칙 설명: docs/matching-rules.md
#  ※ 숫자 설정: config/matching.yaml (고친 뒤 이걸 한 번 돌려야 반영됩니다)
# =============================================================================

name: 도서 매칭

on:
  schedule:
    # UTC 00:00 = 한국시간 09:00
    #
    # 예전에는 07:00(수집 1시간 뒤)이었습니다. 그런데 2026-08-07 에
    # 주간 베스트셀러가 더해지면서 수집 대상이 122개 → 208개가 됐고,
    # 수집이 1시간 안에 안 끝날 수 있게 됐습니다.
    # 매칭이 수집 도중에 시작되면 그날 자료의 절반만 보고 묶게 되므로
    # 넉넉히 3시간 뒤로 미룹니다. (수집 시작 06:00 → 매칭 09:00)
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true 로 두면 DB 에 저장하지 않고 결과만 봅니다"
        required: false
        default: "false"

# 같은 작업이 겹쳐 도는 것을 막습니다
concurrency:
  group: book-match
  cancel-in-progress: false

jobs:
  match:
    name: 같은 책 묶기
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 도구 설치
        # ※ cache: pip 를 쓰지 마세요. --no-cache-dir 과 충돌해 작업이
        #   성공했는데도 실패로 표시됩니다 (2026-08-07 실제로 겪음).
        run: pip install --no-cache-dir -r crawler/requirements.txt

      - name: 규칙 시험 (규칙이 깨졌으면 여기서 멈춤)
        run: python tests/test_match.py

      - name: 매칭 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python crawler/run_match.py

      # -----------------------------------------------------------------
      #  묶은 결과를 실제 자료로 검사합니다.
      #
      #  【왜 필요한가요? — 2026-08-08】
      #  "규칙을 고쳤다" 와 "데이터베이스에서 정말 갈라졌다" 는 다릅니다.
      #  출판사가 다른 책이 한 권으로 뭉쳐 있으면 여기서 빨간불이 납니다.
      #  (확인만 하는 dry_run 일 때는 저장을 안 했으니 건너뜁니다)
      # -----------------------------------------------------------------
      - name: 묶인 결과 검사 (출판사가 섞이지 않았는지)
        if: ${{ inputs.dry_run != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python crawler/verify_publishers.py
