# =============================================================================
#  도서 매칭 — 세 서점의 같은 책을 하나로 묶기
# =============================================================================
#  **수집이 끝나는 즉시** 자동으로 이어서 돌아갑니다 (보통 한국시간 07:15~07:30).
#  예전에는 09:00 이라고 시각을 박아 뒀는데, 수집이 일찍 끝나도 그때까지
#  기다렸습니다. 2026-08-09 부터 앞 작업을 보고 이어 붙입니다.
#  손으로 돌리고 싶으면 아래 주소에서 [Run workflow] 를 누르세요.
#
#  실행: https://github.com/choimog/apple/actions/workflows/match.yml
#
#  ※ 규칙 설명: docs/matching-rules.md
#  ※ 숫자 설정: config/matching.yaml (고친 뒤 이걸 한 번 돌려야 반영됩니다)
# =============================================================================

name: 도서 매칭

on:
  # ---------------------------------------------------------------------
  #  ★ 수집이 끝나면 **바로** 시작합니다 (2026-08-09 대표님 요청)
  # ---------------------------------------------------------------------
  #  예전에는 "09:00 에 시작" 이라고 시각으로 정해 뒀습니다. 수집이
  #  언제 끝날지 몰라서 넉넉히 3시간을 비워 둔 것입니다. 그 대신
  #  수집이 07:20 에 끝나도 매칭은 09:00 까지 그냥 기다렸습니다.
  #
  #  이제는 시계를 보지 않고 **수집이 끝나는 것을 보고** 시작합니다.
  #  실제로 잰 시간: 수집 61~81분 · 매칭 5분.
  #  06:00 에 시작하면 매칭은 보통 07:15~07:30 에 끝납니다.
  workflow_run:
    workflows: ["매일 수집 (daily crawl)"]
    types: [completed]

  schedule:
    # UTC 00:00 = 한국시간 09:00 — **보험용**입니다.
    #
    # 위의 '수집이 끝나면 바로' 가 어떤 이유로든 안 걸리면, 매칭이
    # 통째로 빠진 채 조용히 하루가 지나갑니다. 그것을 막습니다.
    # 이미 매칭이 됐어도 다시 계산할 뿐 결과는 같습니다 (5분·무료).
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true 로 두면 DB 에 저장하지 않고 결과만 봅니다"
        required: false
        default: "false"

# 같은 작업이 겹쳐 도는 것을 막습니다
concurrency:
  group: book-match
  cancel-in-progress: false

jobs:
  match:
    name: 같은 책 묶기
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # ⚠️ '수집이 성공했을 때만' 으로 막으면 안 됩니다.
    #    수집 작업 안에는 [용량 확인] 이 같이 들어 있어서, 저장공간이
    #    한도에 가까우면 수집 자체는 멀쩡해도 전체가 '실패' 로 표시됩니다.
    #    그걸 조건으로 걸면 용량 경고가 뜬 날은 리포트까지 통째로
    #    안 나옵니다. 그래서 '사람이 취소한 경우' 만 건너뜁니다.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion != 'cancelled'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 도구 설치
        # ※ cache: pip 를 쓰지 마세요. --no-cache-dir 과 충돌해 작업이
        #   성공했는데도 실패로 표시됩니다 (2026-08-07 실제로 겪음).
        run: pip install --no-cache-dir -r crawler/requirements.txt

      - name: 규칙 시험 (규칙이 깨졌으면 여기서 멈춤)
        run: |
          python tests/test_match.py
          # 대표님이 "왜 안 묶이지?" 하고 알려주신 실제 책 10건.
          # 규칙을 손댈 때 이 책들이 또 갈라지면 여기서 걸립니다.
          python tests/test_match_reported.py
          python tests/test_manual_split.py
          python tests/test_manual_merge.py
          python tests/test_verify_publishers.py
          # 🚨 출판사를 견주는 '잣대' 가 세 군데(매칭·갈라내기·검사기)에서
          #    똑같은지 봅니다. 2026-08-12 에 한 군데만 고쳤다가 멀쩡한
          #    359종이 '잘못 묶였다' 로 신고되어 매칭이 통째로 멈췄습니다.
          python tests/test_publisher_yardstick.py
          # 웰컴의 [출판사 TOP 8]·[저자 TOP 8] 이 한 곳을 두 줄로 쪼개지
          # 않는지 봅니다 (2026-08-12 대표님 지적).
          python tests/test_names.py
          # 🚨 【2026-08-18 — 실제 매칭 기록에서 발견】
          #    교보문고는 출판사 이름에 분류를 괄호로 붙입니다.
          #      지학사(참고서) · NE능률(참고서)
          #    '참고서' 가 겹친다고 두 곳이 **완전히 같은 출판사**(1.00)가
          #    되고 있었습니다. 그렇게 이어진 것이 줄줄이 붙어 남남인
          #    출판사 수십 곳이 '학산문화사' 한 줄로 합쳐졌습니다.
          #    확인 도구는 같은 잣대를 써서 "0건" 이라고 답했습니다.
          python tests/test_publisher_category.py
          # 검토 화면의 [강제로 묶기] 로 누른 것이 다음 실행에서 도로
          # 풀리지 않는지 봅니다. 풀려도 화면에는 아무 표시가 안 납니다.
          python tests/test_force_join.py
          # [출판사 묶기] 로 정한 것이 나머지 계산을 건드리지 않는지,
          # 풀면 정확히 원래대로 돌아가는지 봅니다 (2026-08-12 대표님 우려).
          python tests/test_publisher_alias.py
          # 🚨 【2026-08-12 — 이 시험이 없어서 대표님이 대신 발견하셨습니다】
          #    위 시험들은 규칙(함수)만 따로따로 봅니다. 그래서 규칙은 다
          #    맞는데 **프로그램이 시작조차 못 하는** 상태를 못 잡았습니다.
          #    (별칭 표를 읽기도 전에 써서 첫 줄에서 죽었습니다)
          #    이건 가짜 데이터베이스로 매칭을 처음부터 끝까지 돌려 봅니다.
          python tests/test_match_smoke.py
          python tests/test_cluster_rules.py
          python tests/test_schedule.py

      - name: 매칭 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python crawler/run_match.py

      # -----------------------------------------------------------------
      #  묶은 결과를 실제 자료로 검사합니다.
      #
      #  【왜 필요한가요? — 2026-08-08】
      #  "규칙을 고쳤다" 와 "데이터베이스에서 정말 갈라졌다" 는 다릅니다.
      #  출판사가 다른 책이 한 권으로 뭉쳐 있으면 여기서 빨간불이 납니다.
      #  (확인만 하는 dry_run 일 때는 저장을 안 했으니 건너뜁니다)
      # -----------------------------------------------------------------
      - name: 묶인 결과 검사 (출판사가 섞이지 않았는지)
        if: ${{ inputs.dry_run != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python crawler/verify_publishers.py
