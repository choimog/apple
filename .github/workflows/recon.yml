# =============================================================================
#  3사 정찰(recon) — 수동 실행 전용
# =============================================================================
#
#  【무엇을 하나요?】
#  크롤러를 만들기 전에, 서점 3사가 클라우드에서 어떻게 응답하는지 확인합니다.
#  데이터를 저장하지 않고 "확인만" 합니다. 서점당 요청은 10건 내외입니다.
#
#  【어떻게 실행하나요?】
#  1. GitHub 저장소 → 위쪽 [Actions] 탭 클릭
#  2. 왼쪽 목록에서 [3사 정찰 (recon)] 클릭
#  3. 오른쪽 [Run workflow ▾] 버튼 클릭 → 초록 [Run workflow] 클릭
#  4. 1~2분 뒤 새로고침하면 실행 결과가 보입니다
#
#  【결과 보는 법】
#  실행을 클릭 → 화면 아래 [Artifacts] → [recon-report] 다운로드
#  압축을 풀면 report.md (보고서) 와 raw/ (응답 원본) 이 들어 있습니다.
# =============================================================================

name: 3사 정찰 (recon)

# workflow_dispatch = "버튼을 눌러야만 실행됨" (자동 실행 안 함)
on:
  workflow_dispatch:

jobs:
  recon:
    name: 서점 3사 응답 확인
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 도구 설치
        run: pip install --no-cache-dir -r crawler/requirements.txt

      - name: 정찰 실행
        run: python crawler/recon.py

      - name: 보고서를 다운로드 가능하게 저장
        # 실패해도 보고서는 남깁니다 (실패 원인이 보고서에 들어있으므로)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recon-report
          path: recon_out/
          retention-days: 30
