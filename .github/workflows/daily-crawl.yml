# =============================================================================
#  매일 자동 수집
# =============================================================================
#
#  【언제 실행되나요?】
#  매일 한국시간 오전 6시 17분 + 못 받았으면 9시 11분에 한 번 더.
#  cron 은 세계표준시(UTC) 기준입니다 (한국시간 = UTC + 9, 서머타임 없음).
#
#  🚨 【2026-09-01 — 왜 정각이 아니라 17분인가요】
#    GitHub 예약은 정시에 안 옵니다. 실제로 이렇게 돌았습니다.
#        예정 08:00 → 실제 10:02 · 10:07 · 10:38 · 13:03 · 15:31
#    그리고 **아예 안 온 날도 있습니다** (8/26 · 8/31 통째로 빠짐).
#
#    예약은 전 세계가 공용 대기열을 씁니다. **정각(0분)이 가장 붐빕니다.**
#    그래서 어중간한 분으로 비켜 놓았습니다. 확실한 해결은 아니고
#    걸릴 확률을 낮추는 것입니다.
#
#  🚨 【그래서 '따라잡기' 를 하나 더 걸어 뒀습니다 — 09:11】
#    이게 진짜 안전장치입니다. 늦거나 아예 안 온 날을 스스로 메웁니다.
#    이미 받은 서점은 건너뛰므로 서점에 요청을 두 번 보내지 않습니다.
#    3사 다 받았으면 **아무 작업도 시작하지 않습니다.**
#    (판단은 crawler/plan_stores.py 한 곳에서 합니다)
#
#  【3사를 동시에 돌립니다 — 2026-08-07 대표님 지시】
#  교보 → 예스24 → 알라딘 순서로 줄 세우면 셋을 더한 시간이 걸립니다.
#  서로 다른 회사이므로 줄 세울 이유가 없습니다. 셋을 따로 돌리면
#  '가장 오래 걸리는 하나' 만큼만 걸립니다.
#      순서대로: 25분 + 20분 + 50분 = 약 95분
#      동시에  : 셋 중 최대       = 약 50분
#
#  ⚠️ 예의는 그대로입니다. 한 서점 안에서는 여전히 한 번에 한 요청씩,
#     1~2초 간격을 지킵니다. 같은 서점에 동시에 두 번 보내지 않습니다.
#     (한 서점당 작업 1개 = 그 서점 입장에서는 전과 완전히 같습니다)
#
#  【수동으로 지금 돌리고 싶을 때】
#  https://github.com/choimog/apple/actions/workflows/daily-crawl.yml
#  → 오른쪽 [Run workflow] 버튼
#     store   : 특정 서점만 돌리기 (비워두면 3사 전체)
#     dry_run : true 로 하면 저장하지 않고 확인만
#
#  【실패했을 때】
#  - 등록된 이메일로 GitHub 이 자동 알림을 보냅니다
#  - 위 주소에서 빨간 ❌ 실행을 눌러 로그를 보세요
#  - 한 서점이 실패해도 나머지 두 서점은 계속 진행합니다
#  - Supabase 의 crawl_logs 표에도 실패 사유가 남습니다
# =============================================================================

name: 매일 수집 (daily crawl)

on:
  schedule:
    # 21:17 UTC = 다음날 06:17 한국시간 — 평소 수집
    - cron: "17 21 * * *"
    # 00:11 UTC = 같은 날 09:11 한국시간 — 따라잡기
    #   ⚠️ 이 줄을 지우면 '아예 안 온 날' 을 아무도 못 메웁니다.
    #      두 예약의 cron 글자는 plan 단계가 구분에 씁니다. 고치시려면
    #      아래 CATCHUP 조건도 같이 고쳐야 합니다 (시험이 확인합니다).
    - cron: "11 0 * * *"

  workflow_dispatch:
    inputs:
      store:
        description: "특정 서점만 (aladin / yes24 / kyobo). 비우면 3사 전체"
        required: false
        default: ""
      dry_run:
        description: "저장하지 않고 확인만 하려면 true"
        required: false
        default: "false"

# 같은 수집이 동시에 두 번 돌지 않게 합니다 (중복 수집 방지)
concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  #  어떤 서점을 돌릴지 먼저 정합니다.
  #    store 입력이 비어 있으면 → 3사 전부
  #    store 입력이 있으면      → 그 서점 하나만
  # ---------------------------------------------------------------------------
  plan:
    name: 대상 서점 정하기
    runs-on: ubuntu-latest
    outputs:
      stores: ${{ steps.pick.outputs.stores }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 도구 설치
        run: pip install --no-cache-dir -r crawler/requirements.txt

      - name: 판단 규칙 시험
        # 여기서 틀리면 '이미 받았다' 고 착각해 그날 수집을 통째로
        # 건너뜁니다. 아무 표시도 안 나는 종류라 먼저 확인합니다.
        run: python tests/test_catchup.py

      - id: pick
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ONLY_STORE: ${{ inputs.store }}
          # 09:11 예약으로 온 것만 '따라잡기' 입니다.
          # 손으로 누른 것과 평소 예약은 예전처럼 전부 돕니다.
          CATCHUP: ${{ github.event.schedule == '11 0 * * *' }}
        run: python crawler/plan_stores.py

  crawl:
    name: 수집 (${{ matrix.store }})
    needs: plan
    # 따라잡기인데 3사 다 받았으면 여기부터 아예 안 돕니다.
    # (서점에 요청도, 헛도는 작업도 없습니다)
    if: needs.plan.outputs.stores != '[]'
    runs-on: ubuntu-latest

    strategy:
      # ⚠️ false 여야 합니다. 한 서점이 실패해도 나머지를 끝까지 돌립니다.
      #    true 로 두면 교보가 넘어졌을 때 알라딘 수집까지 취소됩니다.
      fail-fast: false
      matrix:
        store: ${{ fromJson(needs.plan.outputs.stores) }}

    # 서점 하나당 최대 시간. 가장 오래 걸리는 알라딘이 약 50분입니다.
    # 넉넉히 잡되, 무한정 매달리지는 않게 합니다.
    # 이 저장소는 공개(public) 라서 Actions 실행 시간은 무료·무제한입니다.
    # (비공개로 바꾸면 월 2,000분 한도가 생기므로 그때는 다시 계산해야 합니다)
    timeout-minutes: 150

    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # ⚠️ cache: pip 를 쓰지 마세요.
          #    아래 설치를 --no-cache-dir 로 하기 때문에 저장할 캐시가 없고,
          #    그러면 작업 마지막의 캐시 저장 단계가 실패해서
          #    "수집은 성공했는데 실행은 실패"로 표시됩니다.
          #    (설치가 5초라 캐시 이득도 없습니다)

      - name: 필요한 도구 설치
        run: pip install --no-cache-dir -r crawler/requirements.txt

      - name: 수집 규칙 시험 (규칙이 깨졌으면 여기서 멈춤)
        run: |
          python tests/test_dedupe_ranks.py
          python tests/test_fail_alert.py
          python tests/test_schedule.py
          # 정가를 잘못 읽으면 매칭이 멀쩡한 짝을 갈라냅니다.
          # 2026-08-11 에 실제로 그랬습니다 (교보 2,918,000원).
          python tests/test_prices.py
          # 🚨 2026-08-12 대표님이 원인을 찾아 주심: 알라딘 이벤트 문구의
          #    "(대상도서 15,000원 이상)" 이 정가로 뽑혀, 12,500원짜리 책이
          #    15,000원으로 저장됐습니다. 이벤트 문구가 가격보다 앞에 오면
          #    정가를 밀어냅니다. 이 시험이 그 문구들을 못 박아 둡니다.
          python tests/test_price_parse.py
          # 우리가 일부러 줄인 순위 깊이를 '고장' 이라고 하지 않는지.
          # 2026-08-11 에 이것 때문에 40개 넘는 분야가 헛되이 죽었습니다.
          python tests/test_count_floor.py
          # 🚨 2026-08-19: 바로 다음 단계(브라우저 설치)가 88분을 넘겨 멈췄습니다.
          #    시간 제한이 지워지지 않았는지 여기서 미리 봅니다.
          python tests/test_browser_install.py

      - name: 브라우저(크로미움) 설치
        # 교보문고만 '화면 없는 브라우저' 로 읽습니다.
        # (교보 HTML 은 빈 껍데기여서 자바스크립트 실행이 필요합니다)
        # 다른 서점 작업에서는 설치를 건너뛰어 시간을 아낍니다.
        # 설치 방법은 .github/actions/browser/action.yml 한 곳에만 적혀 있습니다.
        # (2026-08-19 에 설치가 88분 멈춘 사고 이후로 그리로 모았습니다)
        if: ${{ matrix.store == 'kyobo' }}
        uses: ./.github/actions/browser

      - name: 수집 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ONLY_STORE: ${{ matrix.store }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python crawler/run_daily.py

  # ---------------------------------------------------------------------------
  #  수집이 끝난 뒤 용량을 봅니다.
  #
  #  【왜 매일 보나요? — 2026-08-09】
  #  무료 500MB 가 차면 수집이 실패하고 사이트도 멈춥니다. 이 프로젝트를
  #  죽일 수 있는 문제는 사실상 이것 하나입니다. 그런데 그동안은 제가 코드를
  #  고쳐서 올릴 때만 확인했습니다. 제가 손을 떼면 아무도 안 보게 됩니다.
  #
  #  한도에 가까워지면 이 작업이 실패하고, GitHub 이 메일을 보내줍니다.
  #  수집 자체와는 별개 작업이라, 여기가 빨간불이어도 수집은 그대로 돕니다.
  # ---------------------------------------------------------------------------
  capacity:
    name: 용량 확인
    needs: [plan, crawl]
    # 수집이 일부 실패해도 용량은 봐야 합니다.
    # 다만 할 일이 없어 수집을 아예 안 한 날은 재지 않습니다
    # (하루에 두 줄이 남아 '날짜별' 표가 이상해집니다).
    if: always() && needs.plan.outputs.stores != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 도구 설치
        run: pip install --no-cache-dir -r crawler/requirements.txt

      - name: 계산 규칙 시험
        # 이 계산이 실제로 거짓말을 했습니다 (2026-08-09).
        # 틀린 경고가 매번 뜨면 진짜 고장까지 같이 묻힙니다.
        run: python tests/test_capacity.py

      - name: 용량 확인
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python crawler/capacity.py
