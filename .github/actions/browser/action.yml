name: 브라우저(크로미움) 설치
description: 교보문고를 읽는 데 필요한 '화면 없는 브라우저' 를 깝니다.

# =============================================================================
#  왜 이 파일이 따로 있나요 (2026-08-19)
#
#  브라우저 설치는 6개 작업(매일 수집 + 점검·시험용 5개)에서 똑같이 합니다.
#  예전에는 6군데에 같은 줄을 복사해 두었습니다.
#  같은 일을 여섯 군데 적어 두면 반드시 어긋납니다 — 그래서 한 곳으로 모았습니다.
#  이제 여섯 작업 모두 이 파일 한 개를 부릅니다.
#
#  【무슨 사고가 있었나】
#  2026-08-19, '매일 수집' 의 교보문고 작업이 브라우저 설치에서 멈췄습니다.
#  전날(8/18)에는 36초 걸리던 단계가 88분을 넘겨도 안 끝나서 대표님이 끊으셨고,
#  다시 돌려도 또 멈췄습니다.
#
#  원인은 우리 코드가 아니라 **우분투 꾸러미 창고(apt)** 였습니다.
#  로그를 보면 브라우저는 내려받기 시작조차 못 했고,
#  그 전에 하는 '시스템 라이브러리 준비' 에서 멈춰 있었습니다.
#
#      Ign:2 http://azure.archive.ubuntu.com/ubuntu noble InRelease   ← 창고 응답 없음
#      ... (몇 번 다시 시도)
#      Get:5 https://archive.ubuntu.com/ubuntu noble-security InRelease
#      ↑ 여기서 88분간 아무 줄도 안 나옴
#
#  apt 는 창고가 '끊긴' 게 아니라 '아주 느린' 상태면 몇 시간이고 기다립니다.
#  스스로 포기하지 않습니다. 그게 이 사고의 전부입니다.
#
#  【그래서 무엇을 바꿨나】
#  한 줄이던 것을 두 도막으로 나눴습니다.
#
#    ① 시스템 라이브러리 (apt 를 씀) — 멈출 수 있는 쪽.  4분만 기다립니다.
#       못 끝내면 경고만 남기고 넘어갑니다. 러너(깃허브가 빌려주는 컴퓨터)에
#       이미 들어 있는 경우가 대부분이라, 없어도 대개 그냥 돌아갑니다.
#    ② 브라우저 본체 (apt 를 안 씀) — 진짜 필요한 쪽.  실패하면 실패입니다.
#
#  ⚠️ ① 을 건너뛴 날, 만약 라이브러리가 진짜 없으면 브라우저가 안 열립니다.
#     그때는 수집이 **크게 실패로 표시됩니다.** 조용히 빈 데이터를 저장하지
#     않습니다 — 그게 이 프로젝트의 원칙입니다.
#
#  ⚠️ 시간 제한(timeout)을 없애지 마세요. 없애면 8/19 처럼 몇 시간을 잡아먹고,
#     그동안 다른 서점 수집도 끝나지 못한 채 '실행 중' 으로 남습니다.
# =============================================================================

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # ─── ① 시스템 라이브러리 (여기가 멈출 수 있는 곳) ────────────────
        echo "① 시스템 라이브러리 준비 (최대 4분만 기다립니다)"
        if timeout 240 python -m playwright install-deps chromium; then
          echo "   ✅ 준비 완료"
        else
          code=$?
          if [ "$code" -eq 124 ]; then
            echo "::warning title=우분투 창고가 느립니다::시스템 라이브러리 준비가 4분을 넘겨 건너뜁니다. 러너에 이미 들어 있으면 그대로 돕니다. 이 다음 단계가 실패하면 그게 진짜 문제입니다."
          else
            echo "::warning title=시스템 라이브러리 준비 실패::건너뜁니다 (종료 코드 $code)."
          fi
        fi

        # ─── ② 브라우저 본체 (apt 를 안 씁니다. 실패하면 진짜 실패입니다) ──
        echo "② 브라우저(크로미움) 내려받기"
        ok=""
        for i in 1 2 3; do
          if timeout 300 python -m playwright install chromium; then
            ok=1
            break
          fi
          echo "   ⚠️ ${i}번째 실패. 20초 뒤 다시 시도합니다."
          sleep 20
        done
        if [ -z "$ok" ]; then
          echo "::error title=브라우저를 못 깔았습니다::세 번 다 실패했습니다. 교보문고 수집은 이 브라우저가 있어야 합니다."
          exit 1
        fi
        echo "   ✅ 완료"
