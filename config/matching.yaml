# =============================================================================
#  같은 책 찾아내기(매칭) 설정
# =============================================================================
#
#  【이 파일은 뭔가요?】
#  세 서점이 같은 책을 다르게 적어 놓기 때문에, 컴퓨터가 "같은 책"이라고
#  판단하는 기준이 필요합니다. 그 기준의 숫자와 단어 목록이 여기 있습니다.
#
#  【고쳐도 되나요?】
#  네. 아래 숫자와 단어만 고치면 됩니다. 코드는 안 건드려도 됩니다.
#  자세한 설명은 docs/matching-rules.md 를 보세요.
#
#  【고친 뒤에 할 일】
#  GitHub → Actions → [도서 매칭] → Run workflow 를 한 번 눌러야 반영됩니다.
# =============================================================================


# -----------------------------------------------------------------------------
#  1. 배점 (다 합쳐서 100점)
# -----------------------------------------------------------------------------
#  ※ 합계가 100이 아니어도 동작하지만, 아래 thresholds 와 어긋나므로
#    바꿀 때는 thresholds 도 같이 조정하세요.
weights:
  title: 50        # 핵심 제목이 얼마나 닮았는가 (가장 중요)
  author: 25       # 대표 저자가 같은가
  publisher: 15    # 출판사가 같은가
  pub_ym: 10       # 출간월(YYYY-MM)이 같은가


# -----------------------------------------------------------------------------
#  2. 부분 점수를 주는 기준
# -----------------------------------------------------------------------------
partial:
  # 저자가 완전히 같지는 않아도 이만큼 닮았으면 부분 점수를 줍니다
  author_similar_at: 0.80
  author_similar_score: 15

  # 출판사도 마찬가지
  publisher_similar_at: 0.80
  publisher_similar_score: 8

  # 출간월(배본일)을 몇 개월까지 '같은 책' 으로 볼지
  #
  # 【2026-08-09 대표님 지시 — 0 으로 바꿨습니다】
  # "배본일은 한달만 달라도 다른 책으로 구분해줘."
  # 그래서 0 입니다. 출간월이 한 달이라도 다르면 다른 책입니다.
  #
  # ⚠️ 제가 처음에 1 로 뒀던 이유: 서점마다 배본일 기준이 달라
  #    (인쇄일/출고일/판매일) 같은 책도 한 달씩 어긋나게 적히는 일이
  #    있습니다. 0 이면 그런 경우도 갈라집니다. 대표님이 그 설명을 보고
  #    그래도 0 으로 하라고 하셨습니다.
  #    되돌리시려면 이 값을 1 로 바꾸고 [도서 매칭] 을 한 번 돌리면 됩니다.
  pub_ym_near_months: 0

  # 위가 0 이면 '가까움' 이라는 상태 자체가 없어서 이 점수는 안 쓰입니다.
  # (pub_ym_near_months 를 1 이상으로 되돌리면 다시 쓰입니다)
  pub_ym_near_score: 5


# -----------------------------------------------------------------------------
#  3. 판정 기준점
# -----------------------------------------------------------------------------
thresholds:
  auto_high: 85    # 이 점수 이상 → 자동으로 같은 책으로 묶음
  auto_low: 65     # 이 점수 이상 → 묶되 "검토 필요" 표시
                   # 이 점수 미만 → 다른 책으로 판정

  # 제목이 이만큼도 안 닮았으면 점수 계산조차 하지 않고 즉시 거부
  title_hard_floor: 0.60

  # 출간월(배본일)이 다르면 아예 다른 책으로 봅니다 — 2026-08-09 대표님 지시
  #
  #   true  → 위 partial.pub_ym_near_months 보다 더 벌어지면 즉시 거부
  #   false → 예전처럼 점수(10점)로만 반영
  #
  # ⚠️ '얼마나 차이 나면 다른 책인가' 는 위 pub_ym_near_months 로 정합니다.
  #    지금 1개월입니다. 서점마다 배본일 기준이 달라(인쇄일/출고일/판매일)
  #    같은 책도 한 달씩 어긋나게 적히는 일이 흔하기 때문입니다.
  #    딱 맞는 것만 인정하시려면 pub_ym_near_months 를 0 으로 바꾸세요.
  #
  # ⚠️ 한쪽이라도 출간월을 모르면 거부하지 않습니다.
  #    '모른다' 를 '다르다' 로 바꾸면 값이 빈 책이 전부 갈라집니다.
  pub_ym_hard: true

  # 나머지가 **전부** 같으면 출간월 차이를 넘어갈지 (2026-08-12 대표님 제보)
  #
  #   데미안      민음사 8,000원   2000-12 vs 2009-01   ← 같은 책의 다른 쇄
  #   이방인      민음사 10,000원  2019-09 vs 2011-03
  #   돈의 심리학 인플루엔셜 24,800원 2026-01 vs 2021-01
  #
  # 한 서점은 최초 출간일을, 다른 서점은 최근 인쇄일을 적어서 생기는
  # 차이입니다. '한 달만 달라도 다른 책' 은 **정가를 모르던 때** 정한
  # 규칙이었습니다. 이제 더 강한 근거가 있습니다.
  #
  # ⚠️ 조건이 아주 좁습니다. 넷 다 갖춰야 넘어갑니다.
  #      정가가 양쪽에 있고 같음 + 저자 같음 + 출판사 같음 + 제목 같음
  #    개정판·양장본은 정가가 바뀌므로 여기에 걸리지 않습니다.
  #
  # false 로 바꾸면 예전처럼 한 달 차이도 다른 책이 됩니다.
  pub_ym_soft_when_identical: true

  # 출판사가 이만큼도 안 닮았으면 점수와 상관없이 즉시 거부
  #
  # 【2026-08-08 추가 — 대표님 지시】
  # "제목, 저자명이 같아도 출판사가 다르면 아예 다른 책으로 분류해야 해."
  # 민음사·서정시학·다산북스·문학동네의 '싯다르타' 가 한 권으로 뭉쳐 있었습니다.
  # 같은 원작이어도 판권·번역·정가가 다른 별개의 상품입니다.
  #
  # 0.80 = '민음사' 와 '(주)민음사' 처럼 표기만 다른 경우는 같게 보되,
  #        '민음사' 와 '문학동네' 는 확실히 다르게 봅니다.
  # 이 값을 1.0 으로 올리면 글자가 한 자라도 다르면 갈라집니다(너무 엄격).
  # 0.5 밑으로 내리면 다른 출판사가 다시 뭉칠 수 있습니다(위험).
  publisher_hard_floor: 0.80

  # 출판사를 한쪽이라도 모를 때, 낮은 기준(auto_low)으로 묶지 않고
  # 높은 기준(auto_high)을 요구할지.
  #
  # true  = 안전 우선. 출판사를 모르면 어지간해서는 안 묶습니다.
  #         (모른다 ≠ 같다. '싯다르타' 처럼 원작이 같고 출판사만 다른 책이
  #          한쪽 출판사가 비어 있다는 이유로 뭉치는 것을 막습니다)
  # false = 예전처럼 묶되 '검토 필요' 로 표시합니다.
  #
  # 실제로 같은 책인데 갈라지는 게 눈에 띄면 false 로 바꾸세요.
  publisher_unknown_needs_high: true

  # -----------------------------------------------------------------------
  #  정가 (2026-08-11 대표님 지시)
  # -----------------------------------------------------------------------
  #  "정가가 다르면 확실히 다른 도서가 되는 거고,
  #   정가가 같다는 전제 하에 지금의 규칙은 조금 수정해서 조정할 필요가 있다"
  #
  #  도서정가제상 정가는 출판사가 정한 하나의 값이라 3사가 같아야 정상입니다.
  #  ⚠️ 한쪽이라도 모르면 거부하지 않습니다. 정가는 2026-08-11 부터 걷기
  #     시작해서, 그 전에 모은 책에는 값이 없습니다.
  price_hard: true

  # 어느 서점의 정가를 '갈라내는 근거' 로 믿을지 (서점 번호)
  #   1 = 교보문고 · 2 = 예스24 · 3 = 알라딘
  #
  # 【왜 서점을 가리나요? — 2026-08-11 저녁, 실제로 사고가 났습니다】
  # 교보 정가를 알라딘과 맞대 보니 2,663쌍 중 132쌍(5%)이 어긋났습니다.
  #
  #     교보 2,918,000원  vs  알라딘 18,000원   ← '29'+'18,000' 이 이어붙음
  #     교보 1,332,000원  vs  알라딘 32,000원   ← '13'+'32,000'
  #
  # 교보는 화면에 이름표(class)가 없어서 칸 안 글자를 훑어 읽는데,
  # 태그가 붙어 있으면 할인율과 가격이 한 덩어리가 됐습니다.
  # 원인은 고쳤지만(crawler/stores/base.py 의 box_text), **고친 값이
  # 실제로 맞는지는 다음 수집이 돌아야 확인됩니다.**
  #
  # 그때까지 교보(1)를 뺍니다. 확정 거부만 안 할 뿐,
  # 점수 계산에는 계속 씁니다(정가가 같으면 가산점).
  #
  # 【2026-08-11 밤 — 대표님 지시로 교보(1)도 넣었습니다】
  # "수집하기 전, 정가를 기반으로 한 매칭 시스템을 도입해줘.
  #  오늘 새벽부터 바로 적용이 되게끔."
  #
  # 교보 정가가 어긋나던 원인(할인율과 가격이 이어붙던 것)은 고쳤고,
  # 그 사고 세 건을 그대로 시험으로 박아 뒀습니다(tests/test_prices.py,
  # 매일 수집 전에 돕니다). 200만 원을 넘는 값은 아예 버립니다.
  #
  # ⚠️ 다만 **고친 값이 진짜 맞는지는 이번 수집이 돌아야** 압니다.
  #    그래서 매칭이 끝날 때 '정가가 달라서 갈라낸 짝' 을 서점 짝별로
  #    세어서 화면에 찍습니다. 교보가 낀 쪽만 유난히 많으면 아직
  #    덜 고쳐진 것이니, 이 줄을 [2, 3] 으로 되돌리고 알려 주세요.
  price_hard_stores: [1, 2, 3]

  # 제목 한쪽이 다른 쪽의 '앞부분' 일 때 (부제가 붙은 경우) 인정할 최소 길이.
  #   '원소원정대' ⊂ '원소원정대118개캐릭터로마스터하는…'  → 같은 책
  # 너무 짧으면 우연히 겹칩니다 ('밤' ⊂ '밤의여행자들'). 4글자 이상만 봅니다.
  # ⚠️ 저자·출판사·출간월·정가가 **전부 같을 때만** 적용됩니다.
  prefix_min_len: 4
  prefix_title_sim: 0.95

  # -----------------------------------------------------------------------
  #  마지막 보충 — 2권만 묶인 무리에 남은 한 권 채우기 (2026-08-11 대표님 지시)
  # -----------------------------------------------------------------------
  #  "2개의 짝끼리 모여서 이렇게 하나씩만 빠져있는 경우, 명확하게 홀로 남은
  #   한 개의 도서가 어느 정도 유사성을 보인다면, 그 경우에 한해서는 해도
  #   된다는 말이지."
  #
  #  엄격한 규칙을 다 돌린 **뒤에** 딱 한 번 합니다. 조건이 좁습니다.
  #    · 2권짜리 무리에만
  #    · 그 무리에 없는 서점의, 아직 아무 데도 안 묶인 책만
  #    · 무리의 **두 권 모두** 와 이 점수를 넘어야 함
  #    · 후보가 여럿이면 가장 높은 하나만
  #
  #  auto_low(65) 보다 높게 잡았습니다. 보충은 '덤' 이라 더 엄격해야 합니다.
  #  0 으로 두면 이 단계를 아예 하지 않습니다.
  fill_min_score: 70

  # 판형이 아니라 '내용 설명' 에 가까운 말.
  # 저자·출판사·출간월·정가가 전부 같으면 이 말의 차이는 무시합니다.
  #   『오디세이아(고대 그리스어 완역본)』 이 이것 때문에 갈라져 있었습니다.
  # ⚠️ 개정판·양장본 같은 진짜 판형 차이는 여기 넣지 마세요.
  edition_soft_words:
    - 완역본
    - 완역
    - 무삭제판
    - 오리지널
    - 원작


# -----------------------------------------------------------------------------
#  4. 비교 후보 좁히기 (속도용)
# -----------------------------------------------------------------------------
#  8,000권을 전부 짝지어 비교하면 3천만 번이 넘습니다.
#  그래서 "핵심 제목 앞 N글자가 같은 책들끼리만" 비교합니다.
#  숫자를 줄이면  → 더 많이 비교 (정확하지만 느림)
#  숫자를 늘리면  → 덜 비교      (빠르지만 놓칠 수 있음)
blocking:
  title_prefix_len: 4
  also_block_by_author: true   # 대표 저자가 같은 책들끼리도 한 번 더 비교
  max_group_size: 400          # 한 묶음이 이보다 크면 건너뜀 (폭주 방지)


# -----------------------------------------------------------------------------
#  5. 제목에서 떼어낼 '판형/에디션' 단어
# -----------------------------------------------------------------------------
#  ※ 중요: 여기에 적힌 표기가 서로 다르면 '다른 책'으로 판정합니다.
#    (대표님 지시: 개정판·리커버·양장본·세트는 별도 도서)
edition_words:
  - 개정판
  - 개정증보판
  - 개정신판
  - 증보판
  - 리커버
  - 리커버판
  - 양장본
  - 양장
  - 무선본
  - 반양장
  - 특별판
  - 한정판
  - 스페셜에디션
  - 합본
  - 초판본
  - 복간본
  - 완역본
  - 미니북
  - 북클럽

# 같은 뜻인데 서점마다 다르게 적는 표기를 하나로 모읍니다.
#   왼쪽(서점 표기) → 오른쪽(우리가 쓸 이름)
# ※ 이게 없으면 교보의 '양장' 과 알라딘의 '양장본' 이 다른 책으로 판정됩니다.
edition_canonical:
  양장: 양장본
  리커버판: 리커버


# -----------------------------------------------------------------------------
#  5-1. 제목 앞에 붙는 '띠지 문구' — 책 이름이 아닙니다
# -----------------------------------------------------------------------------
#  【2026-08-12 대표님 지적】
#  "'예약판매' 라는 키워드를 제목에서 긁어오면 안 될텐데"
#
#      문해내공        vs  예약판매문해내공     닮은 정도 0.55
#
#  제목이 0.60 만큼도 안 닮으면 **점수를 보기도 전에 다른 책**입니다.
#  서점 화면의 배지(예약판매·오늘출발 …)가 제목 칸 옆에 붙어 있어서
#  글자를 꺼낼 때 같이 딸려 온 것입니다. 책 이름이 아닙니다.
#
#  ⚠️ **제목 맨 앞에 붙어 있을 때만** 뗍니다.
#     『예약판매의 기술』 같은 진짜 제목을 망치지 않기 위해서입니다.
#  ⚠️ 떼고 나서 제목이 비면 원래 값을 씁니다.
#  ⚠️ 진짜 책 이름의 첫머리가 될 만한 말(이벤트·특가·세일 …)은
#     일부러 안 넣었습니다. 배지가 확실한 것만 적습니다.
title_badge_words:
  - 예약판매
  - 예약 판매
  - 오늘출발
  - 오늘 출발
  - 당일발송
  - 무료배송


# -----------------------------------------------------------------------------
#  6. 저자에서 떼어낼 '역할' 단어
# -----------------------------------------------------------------------------
#  "히가시노 게이고 (지은이)" 에서 '지은이' 를 떼어냅니다.
role_words:
  - 지은이
  - 지음
  - 옮긴이
  - 옮김
  - 엮은이
  - 엮음
  - 글
  - 그림
  - 저자
  - 저
  - 역자
  - 역
  - 편저
  - 편
  - 감수
  - 번역
  - 사진
  - 만화


# -----------------------------------------------------------------------------
#  7. 대표 저자를 고르는 순서
# -----------------------------------------------------------------------------
