# =============================================================================
#  수집 대상 URL 목록
# =============================================================================
#
#  【이 파일은 무엇인가요?】
#  매일 어떤 서점의 어떤 분야를 수집할지 적어둔 목록입니다.
#  서점이 새 분야를 만들거나 없애면 "이 파일만" 고치면 됩니다. (코드는 안 건드림)
#
#  【어떻게 고치나요? — 개발 지식 없이 하는 방법】
#  1. GitHub 저장소(https://github.com/choimog/apple) 접속
#  2. config 폴더 → sources.yaml 파일 클릭
#  3. 오른쪽 위 연필(✏️) 아이콘 클릭
#  4. 아래 규칙대로 고친 뒤, 맨 아래 [Commit changes] 초록 버튼 클릭
#  → 다음 날 새벽 수집부터 자동 반영됩니다.
#
#  【띄어쓰기 주의 — 가장 흔한 실수】
#  YAML은 왼쪽 여백(들여쓰기)으로 구조를 판단합니다.
#  - 반드시 "스페이스"만 쓰세요. Tab 키는 오류가 납니다.
#  - 기존 줄과 여백 칸 수를 똑같이 맞추세요.
#  - 가장 안전한 방법: 기존 줄을 통째로 복사해서 붙여넣고 값만 바꾸기
#
#  【각 항목의 뜻】
#    code         : 서점이 쓰는 분야 코드 (URL 안에 들어있는 숫자)
#    name         : 화면에 보일 한글 이름 (자유롭게 지으셔도 됩니다)
#    unified      : 통합 분야 코드. 3사 간 비교를 위한 공통 이름
#                   (config/categories.yaml 에 정의됨. 없으면 비워두세요)
#    url          : 수집할 주소. {page} 자리에 페이지 번호가 자동으로 들어갑니다
#    max_items    : 이 분야에서 최대 몇 권까지 수집할지
#    page_size    : 한 페이지에 몇 권이 나오는지 (모르면 그대로 두세요)
#    enabled      : true=수집함 / false=수집 안 함
#                   ※ 잠시 쉬고 싶으면 지우지 말고 false로 바꾸세요
#
#  【분야를 하나 빼고 싶을 때】
#    그 줄들을 지우지 말고 enabled: true → false 로만 바꾸세요.
#    (지우면 과거 데이터와 연결이 끊어질 수 있습니다)
#
# =============================================================================
#  ✅ 아래 목록은 2026-08-07 대표님이 직접 서점에서 확인해 알려주신 주소입니다.
#     전부 "일간(daily) 베스트셀러" 입니다. (그전에는 주간이었습니다)
#     매일 순위를 추적하는 목적에는 일간이 맞습니다.
# =============================================================================


# -----------------------------------------------------------------------------
#  전역 설정 — 모든 서점에 공통 적용
# -----------------------------------------------------------------------------
defaults:
  # 요청과 요청 사이에 쉬는 시간(초). 서점 서버에 부담을 주지 않기 위한 예의입니다.
  # 이 값을 1.0 밑으로 내리지 마세요. 차단 위험이 커집니다.
  delay_min_sec: 1.0
  delay_max_sec: 2.0

  # 한 서점에 동시에 보낼 요청 수. 1 = 한 번에 하나씩(가장 안전)
  concurrency: 1

  # 실패했을 때 다시 시도할 횟수 (시도할수록 대기 시간이 길어짐 = 지수 백오프)
  max_retries: 4

  # 우리가 누구인지 밝히는 이름표. 서점이 문의할 수 있도록 연락처를 넣는 것이 예의입니다.
  user_agent: "BestsellerTracker/1.0 (+https://github.com/choimog/apple)"

  # 한 요청이 이 시간을 넘으면 실패로 간주 (초)
  timeout_sec: 20

  # 자가 점검: 수집 건수가 "평소 대비 이 비율" 밑이면 성공이 아니라 실패로 기록합니다.
  # 0.5 = 평소의 절반 미만이면 실패 처리 (요구사항 3-3)
  min_ratio_of_median: 0.5



