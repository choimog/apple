# =============================================================================
#  보관소에서 불러오기 — 오래된 날짜를 사이트로 다시 되돌립니다
# =============================================================================
#  무료 요금제에서는 사이트에 최근 2주치만 남습니다.
#  그보다 오래된 기간을 보셔야 할 때 이 작업을 쓰세요.
#
#  다 보신 뒤에는 그냥 두시면 됩니다.
#  매주 월요일 [보관소로 옮기기] 가 자동으로 다시 내보냅니다.
#
#  실행: https://github.com/choimog/apple/actions/workflows/restore.yml
# =============================================================================

name: 보관소에서 불러오기

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "시작 날짜 (예: 2026-06-01)"
        required: true
      to_date:
        description: "끝 날짜 (비우면 시작 날짜 하루만)"
        required: false
        default: ""
      dry_run:
        description: "true 면 무엇을 되돌릴지 보여주기만 합니다"
        required: false
        default: "true"

concurrency:
  group: archive-restore
  cancel-in-progress: false

jobs:
  restore:
    name: 불러오기
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 도구 설치
        run: pip install --no-cache-dir -r crawler/requirements.txt

      - name: 불러오기 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python crawler/restore.py
