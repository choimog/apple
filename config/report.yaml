# =============================================================================
#  AI 일일 리포트 설정
# =============================================================================
#  매일 아침, 어제 순위에서 무슨 일이 있었는지를 한국어로 요약합니다.
#  표를 안 보셔도 흐름을 알 수 있게 하는 것이 목적입니다.
#
#  【켜는 법】 docs/ai-report-setup.md (대표님이 3분)
#  열쇠가 없으면 아무 일도 안 하고 조용히 넘어갑니다.
#
#  🚨 이 파일은 **돈이 드는 유일한 설정**입니다.
#     아래 monthly_cap_usd 를 넘으면 그 달은 **자동으로 멈춥니다.**
# =============================================================================

enabled: true

# ---------------------------------------------------------------------------
#  한 달에 쓸 수 있는 최대 금액 (달러)
# ---------------------------------------------------------------------------
#  대표님 승인: 월 3,300원. 환율을 넉넉히 잡아도 넘지 않도록 3달러로 둡니다.
#  (1달러 = 1,400원 기준 약 4,200원 · 정하신 월 5,000원 예산 안)
#
#  이 금액에 닿으면 그 달 남은 날은 리포트를 만들지 않고 멈춥니다.
#  "조금만 더" 가 없습니다. 넘길 수 없습니다.
monthly_cap_usd: 3.00

# ---------------------------------------------------------------------------
#  어떤 AI 를 쓸지
# ---------------------------------------------------------------------------
#  값이 싼 쪽으로 바꾸고 싶으면 model 만 아래 pricing 에 있는 이름으로 바꾸세요.
#  (claude-haiku-4-5 로 바꾸면 값은 1/5 이지만 글이 단순해집니다)
model: claude-opus-5

# 생각(thinking)은 끕니다.
#   순위표를 읽고 한국어로 정리하는 일이라 깊은 추론이 필요하지 않고,
#   생각한 분량도 돈으로 계산되기 때문에 비용이 들쭉날쭉해집니다.
#   비용을 예측 가능하게 두는 쪽을 골랐습니다.
thinking: false
effort: medium          # low | medium | high
max_tokens: 4000        # 리포트 한 편의 최대 길이

# ---------------------------------------------------------------------------
#  요금표 — 100만 토큰(글자 조각) 당 달러
# ---------------------------------------------------------------------------
#  ⚠️ 출처: Anthropic 공개 요금 (2026-06-24 기준).
#     요금이 바뀌면 여기를 고쳐야 비용 계산이 맞습니다.
#     여기에 없는 model 이름을 쓰면 **일부러 실패합니다.**
#     (0원으로 계산해서 한도를 그냥 지나쳐 버리는 일을 막기 위해서입니다)
pricing:
  claude-opus-5:    {input: 5.0,  output: 25.0}
  claude-sonnet-5:  {input: 3.0,  output: 15.0}
  claude-haiku-4-5: {input: 1.0,  output: 5.0}

# ---------------------------------------------------------------------------
#  무엇을 보여주고 요약을 시킬지
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
#  지난 리포트를 며칠치 같이 볼지 (2026-08-12 대표님 요청)
# ---------------------------------------------------------------------------
#  "이전 7일치의 리포트까지 보고 작성했으면 좋겠어.
#   리포트마다 매번 똑같은 말을 할 수도 있기 때문에 그것을 방지하려는
#   목적도 있고, 이전에 있었던 리포트의 가설이 맞았는지 확인해볼 수도 있고,
#   이전에 있었던 리포트에서 주의 깊게 보라고 했던 그 결과가 어땠는지
#   알 수 있고..."
#
#  🚨 이건 **돈이 더 드는 설정**입니다. 지난 글을 같이 넣는 만큼 값이
#     오릅니다. 리포트 한 편이 1,000자 안팎이므로
#       7일치 ≈ 7,000자 ≈ 하루 3~4센트 (약 50원) 정도 더 듭니다.
#
#  ⚠️ 이 때문에 이번 달 한도에 부담이 커지면, 프로그램이 **스스로 날수를
#     줄이고 그 사실을 화면에 적습니다.** 조용히 줄이지 않습니다.
#
#  0 으로 두면 지난 리포트를 아예 안 봅니다 (예전 방식).
history_days: 7
history_max_chars: 1500   # 리포트 한 편을 몇 자까지 넣을지 (넘으면 뒤를 자름)

top: 40                 # 종합 순위 몇 위까지 보여줄지
compare_depth: 300      # 어제 순위를 몇 위까지 뒤져서 변화를 계산할지
publishers: 12          # 출판사 순위 몇 개까지
min_stores: 2           # 종합에 넣을 최소 서점 수
big_move: 20            # 몇 계단 이상 움직이면 '크게 움직였다' 로 볼지
