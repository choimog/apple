# =============================================================================
#  서점별 선택자(값 뽑는 규칙)
# =============================================================================
#
#  【이 파일은 무엇인가요?】
#  서점 화면의 "어느 위치에서 어떤 값을 꺼낼지" 적어둔 규칙입니다.
#  서점이 화면을 개편하면 수집이 깨지는데, 그때 고칠 곳이 바로 여기입니다.
#  (코드는 건드릴 필요 없습니다)
#
#  【수집이 깨졌을 때 고치는 순서】
#  1. GitHub Actions 에서 실패한 실행의 로그를 봅니다
#     → "제목을 못 찾음" 같은 메시지가 나옵니다
#  2. 해당 서점 페이지를 브라우저로 엽니다
#  3. 값 위에서 마우스 오른쪽 클릭 → [검사] 클릭
#  4. 파란색으로 표시된 줄에서 class="..." 부분을 확인합니다
#  5. 이 파일에서 그 항목의 값을 새 class 이름으로 바꿉니다
#     예: title: "a.bo3"  →  title: "a.new_title_class"
#  6. 저장(Commit)하면 다음 실행부터 반영됩니다
#
#  【선택자 읽는 법】
#    "a.bo3"          = <a class="bo3"> 태그
#    "span.sales_point" = <span class="sales_point"> 태그
#    "div.ss_book_box"  = <div class="ss_book_box"> 태그
#    "@itemid"        = 태그의 itemid 속성값 (태그 안이 아니라 속성에서 꺼냄)
#
#  ※ 2026-08-07 정밀 탐침으로 실제 HTML 을 확인해서 작성했습니다. 추측 아님.
# =============================================================================


# -----------------------------------------------------------------------------
#  알라딘
# -----------------------------------------------------------------------------
#  실제 확인된 구조 (2026-08-07):
#    <div class="ss_book_box" itemid="398021172">
#      <div ...>2.</div>                          ← 순위
#      <div class="cover_area">
#        <img class="front_cover" src=".../cover200/xxx.jpg">   ← 표지
#      <div class="ss_book_list"><ul>
#        <li><span class="ss_ht1"><a>변색 유리컵</a></span></li>        ← 이벤트
#        <li><a class="bo3">투명한 나선</a>                              ← 제목
#            <a class="ss_f_g2">탐정 갈릴레오 시리즈 10</a></li>          ← 시리즈
#        <li><a href="...AuthorSearch=...">히가시노 게이고</a> (지은이),
#            <a href="...AuthorSearch=...">김선영</a> (옮긴이) |
#            <a href="...PublisherSearch=...">북다</a> | 2026년 7월</li>  ← 저자·출판사·출간월
#        <li>... 세일즈포인트 :<span class="sales_point"> 139,090</span></li>
#      </ul></div>
#    </div>
# -----------------------------------------------------------------------------
aladin:
  # 도서 한 칸을 감싸는 태그. 이걸 못 찾으면 수집 전체가 실패합니다.
  book_box: "div.ss_book_box"

  # 서점 내부 상품번호. div 의 itemid 속성에서 꺼냅니다.
  # 이 값으로 "같은 책인지"를 알라딘 안에서 판단합니다.
  store_book_key: "@itemid"

  # 도서명
  title: "a.bo3"

  # 시리즈명 (있는 책만). 제목 정규화 때 참고합니다.
  series: "a.ss_f_g2"

  # 표지 이미지. cover200 = 가로 200px 짜리 작은 이미지입니다.
  # ※ 이미지를 저장하지 않고 이 주소를 그대로 DB에 넣습니다.
  cover: "img.front_cover"

  # 저자 링크들. 링크가 여러 개면 여러 명입니다.
  # 각 이름 뒤의 (지은이)/(옮긴이) 같은 역할어는 코드가 따로 읽습니다.
  author_links: 'a[href*="AuthorSearch"]'

  # 출판사 링크
  publisher_link: 'a[href*="PublisherSearch"]'

  # 세일즈포인트 (판매지수)
  sales_point: "span.sales_point"

  # 이벤트 문구
  event: "span.ss_ht1"

  # 순위: 별도 class 가 없어서 도서 칸 맨 앞의 "2." 형태 숫자를 읽습니다.
  # 못 읽으면 목록에 나온 순서로 대체합니다 (page 1 의 3번째 = 3위).
  rank_from_text: true

  # 출간일: 저자 줄 맨 뒤의 "2026년 7월" 을 읽습니다. 일자는 안 나옵니다.
  pub_date_pattern: '(\d{4})\s*년\s*(\d{1,2})\s*월'

  # 이 서점 목록에 ISBN13 은 나오지 않습니다. (2026-08-07 확인)
  # ISBN 처럼 보이는 K082130602 는 알라딘 내부 코드이지 ISBN 이 아닙니다.
  isbn13: null

  # 자가 점검: 한 페이지에서 이 개수보다 적게 나오면 이상 신호로 봅니다.
  min_items_per_page: 40


# -----------------------------------------------------------------------------
#  예스24
# -----------------------------------------------------------------------------
#  실제 확인된 구조 (2026-08-07 탐침):
#    <div class="itemUnit">
#      <em class="ico rank">1</em>                        ← 순위
#      <span class="rank_info rank_even">                 ← 등락(rank_up/down/even)
#        <em class="txt rank"></em>위 상승                  ← 등락 폭
#      <img class="lazy" data-original=".../goods/192474512/L">  ← 표지(지연 로딩)
#      <div class="item_info">
#        <a class="gd_name" href="/product/goods/192474512">세네카, 오늘을…</a>  ← 제목
#        <span class="authPub info_auth">
#          <a>루키우스 안나이우스 세네카</a> 저/<a>하와이 대저택</a> 편역          ← 저자
#        <span class="authPub info_pub"><a>논픽션</a></span>                  ← 출판사
#        <span class="authPub info_date">2026년 07월</span>                   ← 출간월
#        <dl class="info_present"><dd><a>[이달의 책 8월] …</a></dd></dl>       ← 이벤트
#        <span class="saleNum"> 판매지수 302,604 </span>                       ← 판매지수
#        <div class="info_tag"><span class="tag"><a>#불멸의고전</a></span>…    ← 해시태그
# -----------------------------------------------------------------------------
yes24:
  book_box: "div.itemUnit"

  # 상품번호는 제목 링크 주소(/product/goods/192474512)에서 숫자만 뽑습니다
  store_book_key_from_href: "a.gd_name"
  store_book_key_pattern: '/goods/(\d+)'

  title: "a.gd_name"

  # 표지는 지연 로딩(lazy loading)이라 src 가 아니라 data-original 에 들어 있습니다.
  # src 에는 "이미지 없음" 그림이 들어 있으니 쓰면 안 됩니다.
  cover: "img.lazy"
  cover_attr: "data-original"

  # 저자 영역 전체. 안에 여러 명이 "이름 역할/이름 역할" 형태로 들어 있습니다.
  author_box: "span.info_auth"
  author_links: "span.info_auth a"

  publisher_link: "span.info_pub a"
  pub_date: "span.info_date"
  pub_date_pattern: '(\d{4})\s*년\s*(\d{1,2})\s*월'

  sales_point: "span.saleNum"

  # 해시태그 (예스24만 제공)
  hashtags: "div.info_tag span.tag a"

  # 이벤트/구매혜택
  event: "dl.info_present dd a"

  # 순위
  rank_text: "em.ico.rank"

  # 등락 — 예스24가 직접 알려줍니다. 우리 계산값과 교차 검증에 쓸 수 있습니다.
  rank_info: "span.rank_info"
  rank_change_amount: "em.txt.rank"

  # 이 서점 목록에도 ISBN13 은 없습니다. (2026-08-07 확인)
  isbn13: null

  min_items_per_page: 20
