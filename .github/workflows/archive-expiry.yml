# =============================================================================
#  보관 파일 만료 알림 — 사라지기 전에 메일로 알려드립니다
# =============================================================================
#  【왜 필요한가요? — 2026-08-09】
#  GitHub 보관 기간의 최대값은 **90일**입니다.
#  (예전에 400일이라고 안내드린 것은 제 착오였습니다)
#
#  90일이면 두세 달에 한 번은 내려받아 두셔야 하는데, 사이트 [수집 상태]
#  화면을 매주 들여다보실 리가 없습니다. 그래서 매주 확인해서
#  30일 밑으로 남았으면 **일부러 이 작업을 실패시킵니다.**
#  GitHub 은 작업이 실패하면 메일을 보내주기 때문입니다.
#
#  【빨간 X 가 떠도 고장난 게 아닙니다】
#  "파일을 받아 두세요" 라는 뜻입니다. 메일 안에 주소가 들어 있습니다.
#
#  【알림을 멈추려면】
#  파일을 받으신 뒤, 이 작업을 손으로 한 번 돌리시면 됩니다.
#  Run workflow → '내려받아 저장을 마쳤습니다' 를 true 로 → Run
#
#  실행: https://github.com/choimog/apple/actions/workflows/archive-expiry.yml
# =============================================================================

name: 보관 파일 만료 알림

on:
  schedule:
    # 매주 목요일 UTC 23:00 = 금요일 한국시간 08:00
    # (보관 작업은 화요일 아침이라, 이틀 뒤에 확인합니다)
    - cron: "0 23 * * 4"
  workflow_dispatch:
    inputs:
      mark_saved:
        description: "내려받아 저장을 마쳤습니다 (true 로 두면 알림이 멈춥니다)"
        type: choice
        options: ["false", "true"]
        default: "false"

concurrency:
  group: archive-expiry
  cancel-in-progress: false

jobs:
  expiry:
    name: 사라질 파일 확인
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 도구 설치
        run: pip install --no-cache-dir -r crawler/requirements.txt

      - name: 알림 규칙 시험
        run: python tests/test_archive_expiry.py

      - name: 내려받음으로 표시
        if: inputs.mark_saved == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python crawler/archive.py --mark-saved

      - name: 사라질 파일이 있는지 확인
        if: inputs.mark_saved != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python crawler/archive.py --check-expiry
