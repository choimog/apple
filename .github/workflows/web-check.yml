# =============================================================================
#  웹 사이트 확인
# =============================================================================
#  사이트 코드를 고칠 때마다 자동으로 두 가지를 확인합니다.
#
#    1. 빌드가 되는가        (문법 오류·타입 오류 잡기)
#    2. 조회문이 실제로 되는가 (배포하고 나서 빈 화면 보는 일 방지)
#
#  ※ 2번은 실제 데이터베이스에 붙습니다. 읽기만 합니다.
#  ※ 관리자 열쇠는 이 작업 안에서만 쓰이고, 배포되는 사이트에는 들어가지 않습니다.
# =============================================================================

name: 웹 사이트 확인

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web-check.yml"
  workflow_dispatch:

jobs:
  check:
    name: 빌드 + 조회문 확인
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 필요한 도구 설치
        run: npm ci --no-audit --no-fund

      - name: 조회문이 실제 데이터베이스에서 되는지 확인
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-queries.mjs

      - name: 사이트와 같은 열쇠(공개용)로 읽히는지 확인
        # 관리자 열쇠로만 확인하면 보안 잠금(RLS) 문제를 못 잡습니다.
        # 실제로 2026-08-07 에 조회문은 다 통과했는데 배포한 사이트는
        # "데이터가 없습니다" 로 떴습니다. 그래서 같은 열쇠로 한 번 더 봅니다.
        # SUPABASE_ANON_KEY 가 없으면 건너뜁니다.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/check-anon.mjs

      - name: 빌드 (실제 열쇠는 안 씁니다)
        # 빌드할 때는 가짜 주소를 씁니다. 실제 값은 Vercel 에 등록돼 있습니다.
        # (관리자 열쇠가 사이트 코드에 섞여 들어가지 않도록)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://build-check.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-check
        run: npx next build

      - name: 실제 데이터로 다시 빌드 + 모든 화면 열어보기
        # 빌드가 통과해도 화면이 멀쩡하다는 뜻은 아닙니다.
        # 위 빌드는 가짜 접속 정보로 돌기 때문에 조회문이 실제로 도는지
        # 확인하지 못합니다. 여기서 진짜 열쇠로 띄우고 전부 열어봅니다.
        # (SUPABASE_ANON_KEY 가 없으면 스스로 건너뜁니다)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            # ⚠️ 지난 빌드 결과를 지우고 새로 빌드합니다.
            #    남아 있으면 Next 가 예전 판단(정적/동적)을 재사용해서,
            #    주소 뒤 값(?period=weekly)을 쓰는 화면이 열릴 때 오류가 납니다.
            #    (2026-08-08 실제로 겪음)
            rm -rf .next
            npx next build
          fi
          node scripts/smoke.mjs

      - name: 보안 취약점 확인
        run: npm audit --omit=dev
