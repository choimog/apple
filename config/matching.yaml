# -----------------------------------------------------------------------------
#  8-1. 🚨 괄호 안에 와도 '다른 이름' 으로 보지 않을 말 (분류어)
# -----------------------------------------------------------------------------
#  【2026-08-18 매칭 기록에서 발견】
#
#  괄호 안은 보통 **다른 이름**입니다.
#      YBM(와이비엠)  →  '와이비엠' 도 같은 곳          ✅
#
#  그런데 교보문고는 출판사 이름에 **분류**를 괄호로 붙입니다.
#      지학사(참고서)  ·  NE능률(참고서)
#      시공사(만화)    ·  학산문화사(만화)
#
#  '참고서' 가 겹친다고 지학사와 NE능률이 **닮은 정도 1.00**, 즉 완전히
#  같은 출판사가 되고 있었습니다. 그렇게 이어진 것이 줄줄이 붙어
#  이런 덩어리가 나왔습니다.
#
#      학산문화사 ← NE능률 · 교보문고 · 시공사 · 지학사 · 메가스터디북스
#                   · 군자출판사 · 한빛아카데미 · 해냄에듀 · 키움 …
#
#  웰컴 화면의 [출판사 TOP 8] 과 출판사별 화면이 그대로 틀리고, 매칭에서도
#  '출판사가 다르니 다른 책' 이라는 갈라내기가 이 짝들에서는 안 먹습니다.
#
#  ⚠️ 여기 적은 말은 **괄호 안에 있을 때만** 무시합니다.
#     괄호 밖 이름('지학사')은 그대로 남으므로, 예스24의 '지학사' 와는
#     여전히 이어집니다. 잃는 것이 없습니다.
#
#  ⚠️ 이 목록을 비워도 기본값은 계속 켜져 있습니다
#     (crawler/common/match.py 의 _CATEGORY_DEFAULT).
#     설정 한 줄을 지웠다고 지학사와 NE능률이 다시 같은 출판사가 되면
#     안 되기 때문입니다. 여기에는 **더할 말만** 적으시면 됩니다.
#
#  새 분류어를 발견하시면 여기에 한 줄 더하고 [도서 매칭] 을 다시 돌리세요.
#  (다시 수집할 필요 없습니다 — 비교할 때 계산합니다)
