# =============================================================================
#  분야·매장 코드 찾기 (수동 실행 전용)
# =============================================================================
#  각 서점의 전체 분야 코드와 교보 매장 코드를 찾아냅니다.
#  결과는 config/sources.yaml 에 그대로 붙여넣을 수 있는 형태로 나옵니다.
#
#  ※ 서점당 몇 건의 목록 페이지만 봅니다. 상세 페이지 진입 없음.
#
#  실행: https://github.com/choimog/apple/actions/workflows/probe-catalog.yml
# =============================================================================

name: 분야·매장 코드 찾기

on:
  workflow_dispatch:
    inputs:
      store:
        description: "특정 서점만 (aladin / yes24 / kyobo). 비우면 전체"
        required: false
        default: ""

jobs:
  probe:
    name: 코드 수집
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 도구 설치
        run: pip install --no-cache-dir -r crawler/requirements.txt

      - name: 브라우저(크로미움) 설치
        if: ${{ inputs.store == '' || contains(inputs.store, 'kyobo') }}
        uses: ./.github/actions/browser

      - name: 탐침 실행
        run: python crawler/probe_catalog.py "${{ inputs.store }}"
